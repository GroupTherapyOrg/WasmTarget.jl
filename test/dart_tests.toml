["tests/language/function/type_alias6_test.dart"]
kind = "behavior"
what = "a bound method returning C is not a C = D Function(), one returning D is; the self-referencing typedef F (COMPILE_TIME_ERROR.TYPE_ALIAS_CANNOT_REFERENCE_ITSELF) and its two checks are not ported"
cases = ["dart_function/type_alias6"]

["tests/language/function/type_alias7_test.dart"]
kind = "not_portable"
what = "typedefs with default parameter values and a class extending a typedef"
reason = "multitest sections 00, 01 and 02 are each a compile-time error (default values in a typedef, extending a typedef) and main without them only constructs an empty class, checking nothing"

["tests/language/function/type_alias8_test.dart"]
kind = "behavior"
what = "a static final function typed by a bounded generic typedef returning a nullable generic function type, called without a type error (regression for issue 9442); the argument picks it or a second typedef value returning a non-null function, so the null result depends on it"
cases = ["dart_function/type_alias8"]

["tests/language/function/type_alias9_test.dart"]
kind = "not_portable"
what = "mutually referencing typedefs F and G and a cast between them"
reason = "its expectations are COMPILE_TIME_ERROR.TYPE_ALIAS_CANNOT_REFERENCE_ITSELF on F and G, and main only casts null between those ill-formed types, checking nothing"

["tests/language/function/type_alias_test.dart"]
kind = "behavior"
