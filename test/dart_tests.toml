["tests/language/function/type3_test.dart"]
kind = "behavior"
what = "a method of a generic class reached through another generic method, torn off, is a zero-argument function and not a one-argument function"
cases = ["dart_function/type3"]

["tests/language/function/type_alias10_test.dart"]
kind = "behavior"
what = "a nullable field of a generic typedef type, null then assigned a literal returning its argument's runtime type"
cases = ["dart_function/type_alias10"]

["tests/language/function/type_alias2_test.dart"]
kind = "behavior"
what = "is checks of functions and bound methods with optional positional or named parameters against generic typedefs; dart gives a class type parameter's covariant parameter type Object? at run time, Julia's method keeps T, so a.baz and a.bar answer false for the raw, Object and double typedefs where dart answers true"
cases = ["dart_function/type_alias2"]

["tests/language/function/type_alias3_test.dart"]
kind = "behavior"
what = "is checks of a bound method of a generic class against a typedef whose result is an imported generic class named like its type parameter; library11's Library111 is the struct _FnTa3Lib"
cases = ["dart_function/type_alias3"]

["tests/language/function/type_alias4_test.dart"]
kind = "behavior"
what = "is checks of functions and bound methods against a typedef whose type parameter is named bool; dart treats the covariant parameter of A<T>.foo as Object so b.foo and i.foo are F and F<Object>, Julia keeps T and answers false"
cases = ["dart_function/type_alias4"]

["tests/language/function/type_alias5_test.dart"]
kind = "not_portable"
what = "illegally self-referencing and mutually referencing typedefs"
