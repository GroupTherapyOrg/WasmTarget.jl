what = "--standalone mode imports no JS string globals"
reason = "a dart2wasm option selecting a JS-free host; WT has one host contract (1.F) and no mode switch"

["pkg/dart2wasm/test/ir_tests/always_throws.dart"]
kind = "structural"
what = "a call of a function whose return type is Never is followed by unreachable"
property = "a call Julia infers as Union{} (a callee that always throws) is followed by unreachable and nothing after it, and the throwing callee ends in its throw call and unreachable"
cases = ["dart_structural/always_throws"]

["pkg/dart2wasm/test/ir_tests/constant_string_ops.dart"]
kind = "structural"
what = "length and codeUnitAt of a constant string fold to constants; constant strings concatenate (constant by design: the golden pins that these fold to constants)"
property = "a query Julia's optimizer folds on a constant string (its length, a code unit) is a constant in the module, no call; concatenation of constant strings emits one concatenation"
cases = ["dart_structural/constant_string_ops"]

["pkg/dart2wasm/test/ir_tests/pure_function.dart"]
kind = "not_portable"
what = "a function marked wasm:pure-function has its unused calls removed by wasm-opt"
reason = "a dart pragma for binaryen's optimizer; Julia declares no pragmas, and its effect analysis is its own, ported where Julia answers it"

["pkg/dart2wasm/test/ir_tests/external_effect.dart"]
kind = "not_portable"
what = "an external function marked external-effect keeps its argument's computation"
reason = "a dart pragma on an external declaration; Julia has no external declarations, a foreigncall's effects are Julia's"

["pkg/dart2wasm/test/ir_tests/math_min_max.dart"]
kind = "structural"
what = "math.min and math.max of int, double and num operands"
