["tests/language/function/function_test.dart"]
kind = "behavior"
what = "closures in constructor bodies, initializer lists, super initializers and statics; variable declaration order; block-scoped and loop-scoped captures; forEach; default and positional parameter order; defaults of literals; escaping local functions; this captured; the uncalled typedef assignments (UseFunctionTypes, Bar) are not ported"
cases = ["dart_function/function"]

["tests/language/function/getter_test.dart"]
kind = "behavior"
what = "a method torn off and called equals the method called"
cases = ["dart_function/getter"]

["tests/language/function/literals2_test.dart"]
kind = "behavior"
what = "local function statements, a literal in a variable, literals as arguments, in constructor initializer lists and fields, and called inside string interpolation"
cases = ["dart_function/literals2"]

["tests/language/function/literals_test.dart"]
kind = "behavior"
what = "arrow and block function literals, typed and untyped, returning ints or int functions, passed to generic higher-order functions, and instance methods passed as values"
cases = ["dart_function/literals"]

["tests/language/function/local2_test.dart"]
kind = "behavior"
what = "two closures updating one captured local; a literal typed by a class type parameter passed to a generic method"
cases = ["dart_function/local2"]

["tests/language/function/local3_test.dart"]
kind = "behavior"
what = "a closure is an Object and calling a method it lacks throws (MethodError in Julia); dart's toString starting with Closure is not ported, Julia prints a closure by its type name"
cases = ["dart_function/local3"]

["tests/language/function/local_function_test.dart"]
kind = "behavior"
what = "local functions capturing parameters and locals, a loop variable shared (declared outside the loop) or per iteration, fields through getters and setters, recursion shadowing a static (the local recurses through itself passed as an argument, so nothing is boxed), nesting, a static closure field, wrong-arity calls and a call of a non-function throwing; dart's toString check is not ported and f.xyz is a missing method throwing MethodError"
cases = ["dart_function/local_function"]

["tests/language/function/malformed_result_type_test.dart"]
kind = "not_portable"
what = "a local function whose result type has the wrong number of type arguments"
reason = "its one expectation is COMPILE_TIME_ERROR.WRONG_NUMBER_OF_TYPE_ARGUMENTS and main only declares that uncalled local function"

["tests/language/function/propagation_test.dart"]
kind = "behavior"
what = "a class with a call method is not a function type, and its implicit call tear-off is not the object; Julia's applicable answers true for the callable struct where dart's notType<F> holds"
cases = ["dart_function/propagation"]

["tests/language/function/regress_45601_test.dart"]
kind = "behavior"
what = "a function stored in a map key's field drives its == and hashCode; equality of function values, null and a generic function, statically and dynamically typed (the same in Julia)"
cases = ["dart_function/regress_45601"]

["tests/language/function/syntax_test.dart"]
kind = "behavior"
what = "function statement and expression syntax: local functions with and without types, literals as arguments, operator precedence inside arrow bodies, closures in constructor initializers (direct, wrapped, from a list, from a map), function-typed parameters; the syntax-error multitest sections are dropped and the n* and r* constructors repeat the c* shapes so the eight c* are ported"
cases = ["dart_function/syntax"]

["tests/language/function/type2_test.dart"]
kind = "behavior"
what = "a super constructor calls a literal whose parameter has the subclass's type parameter String with an int, throwing; dart throws a TypeError, Julia's typed closure throws MethodError"
