# test/dart_tests.toml — dart2wasm's test set at the pin, ported with Julia as the ground truth
# (dev/LEDGER.md D41, dev/MARCH.md 1.T; L226 reads this file and the pinned checkout).
#
# Every .dart file at the commit dev/PARITY_MASTER.md pins under pkg/dart2wasm/test, tests/web/wasm and
# tests/language has exactly one entry covering it: an entry named by the file's own path, or by a
# directory's path ending in `/`, which covers every .dart file under it (tests/language is
# classified by directory first; a directory entry is split into file entries when its tests are
# ported). An entry carries `what` (the construct the dart test exercises) and a `kind`:
#   behavior      a program whose result Julia decides: `cases` names the smoke cases porting it
#                 (`<group>/<case>` of test/smoke_corpus.jl, each existing), the expected value what
#                 native Julia computes, never dart's (D3); `cases = []` until it is ported
#   structural    a golden or a property of dart2wasm's emitted module: `property` states the property
#                 the golden pins, to check on WT's emitted module once the compiler emits, and
#                 `cases` the smoke cases writing the same construct in Julia ([] until written)
#   not_portable  a dart-only feature or dart2wasm tooling: `reason` says why
#   helper        a library a test imports, no test itself: `of` names the entries it serves
# Values are one-line strings or one-line lists of strings, with no double quote inside a value.

# ---- pkg/dart2wasm/test ----------------------------------------------------------------------------

["pkg/dart2wasm/test/ir_test.dart"]
kind = "structural"
what = "the IR-golden runner: compiles each ir_tests program, prints the module filtered by function, type, global and table name, and compares it with the .wat golden"
property = "each ported golden's property is checked on WT's emitted module (wasm-tools print of the bytes), never byte for byte across source languages"
cases = []

["pkg/dart2wasm/test/util.dart"]
kind = "helper"
of = ["pkg/dart2wasm/test/ir_test.dart", "pkg/dart2wasm/test/wasm_read_write_test.dart", "pkg/dart2wasm/test/wasm2wat_test.dart", "pkg/dart2wasm/test/self_compile_test.dart", "pkg/dart2wasm/test/record_use_test.dart", "pkg/dart2wasm/test/phases/", "pkg/dart2wasm/test/deferred_loading/"]
what = "process and temporary-directory helpers of the tooling tests"

["pkg/dart2wasm/test/wasm_read_write_test.dart"]
kind = "not_portable"
what = "wasm_builder's deserializer reads a dart2wasm module and its serializer writes the same bytes"
reason = "the deserializer is outside WT's scope (src/julia/parity.jl's pin table holds wasm_builder's ir, builder and serialize, no deserializer); WT's serializer is checked by 1.B's byte identity with wasm-tools on hand-built modules"

["pkg/dart2wasm/test/wasm2wat_test.dart"]
kind = "not_portable"
what = "wasm_builder's deserializer and printer print a dart2wasm module, before and after wasm-opt"
reason = "the deserializer and printer are outside WT's scope (the pin table holds neither); WT prints modules with wasm-tools, the alarm only"

["pkg/dart2wasm/test/self_compile_test.dart"]
kind = "not_portable"
what = "dart2wasm compiles itself and the wasm compiler's output equals the VM's"
reason = "self-hosting: WT is a Julia package compiling Julia programs to a frozen module, never itself; reflection and eval are outside its scope (dev/PARITY_MASTER.md)"

["pkg/dart2wasm/test/record_use_test.dart"]
kind = "not_portable"
what = "dart2wasm records the uses of @RecordUse-annotated definitions into a JSON file"
reason = "package:record_use is dart's build-hook tooling with no Julia counterpart"

["pkg/dart2wasm/test/phases/"]
kind = "not_portable"
what = "the compiler run in phases: kernel from the CFE, the TFA dill, wasm, then wasm-opt, each phase's output resumed by the next"
reason = "dart's kernel pipeline and its dill files; WT's front end is Julia's own inference (D3), whose stages are Julia's"

["pkg/dart2wasm/test/dry_run/"]
kind = "not_portable"
what = "the dry-run mode's diagnostics for programs importing dart:html, dart:js, dart:ffi or misusing JS interop types"
reason = "diagnostics of dart's front end over dart libraries; WT's rejections are Julia's verifier's and its own located ones (D32, D9)"

["pkg/dart2wasm/test/deferred_loading/"]
kind = "not_portable"
what = "the deferred-loading partitioner, its dominator tree and the deferred map of loading units"
reason = "deferred loading splits the program into modules loaded on demand; dev/PARITY_MASTER.md scopes WT to one frozen closed-world module"

