name: Formal models
on:
  push:
    branches: [main, 'march/**']
  pull_request:
  schedule:
    - cron: '17 3 * * *'   # nightly: the same harness plus dev/formal/nightly (instances too large for a 20-minute gate)
# Only the newest push per branch runs; a superseded run is cancelled.
concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 300 || 20 }}
    # A push checks every instance, split over three runners (run_tlc.sh TLC_SHARD); the
    # nightly run checks them all on one, with dev/formal/nightly.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ github.event_name == 'schedule' && fromJSON('[""]') || fromJSON('["0/3", "1/3", "2/3"]') }}
    env:
      TLC_NIGHTLY: ${{ github.event_name == 'schedule' && '1' || '0' }}
      TLC_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Model-check every instance under dev/formal (and require the Broken ones to fail)
        run: dev/formal/run_tlc.sh
