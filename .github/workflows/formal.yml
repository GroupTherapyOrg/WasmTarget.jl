name: Formal models
on:
  push:
    # the full matrix's triggers (gate.yml; Dale 2026-10-21: large-scale runs only when a full clause is
    # closed out): a march/** head whose commit carries a `Closes: C<n>` line, a gate/** push (PR #122's
    # merge head, `bash dev/gate.sh`) and a dispatch; a plain march/** push, a landing, runs nothing.
    # Every job with no `needs:` runs only under the closure predicate, gate.yml's run-name's and closure
    # job's text (L153); the pull request, whose branch every landing pushes, triggers nothing (A23E4)
    branches: ['gate/**', 'march/**']
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'   # nightly: the same harness plus dev/formal/nightly (instances too large for a 20-minute gate)
# Only the newest push per branch runs; a superseded run is cancelled.
concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tlc:
    if: >-
      ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/heads/gate/') || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C0', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C1', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C2', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C3', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C4', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C5', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C6', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C7', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C8', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C9', fromJSON('"\n"'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 300 || 20 }}
    # A push checks every instance, split over three runners (run_tlc.sh TLC_SHARD); the
    # nightly run checks them all on one, with dev/formal/nightly.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ github.event_name == 'schedule' && fromJSON('[""]') || fromJSON('["0/3", "1/3", "2/3"]') }}
    env:
      TLC_NIGHTLY: ${{ github.event_name == 'schedule' && '1' || '0' }}
      TLC_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Model-check every instance under dev/formal (and require the Broken ones to fail)
        run: dev/formal/run_tlc.sh
