name: CI

on:
  push:
    # the full matrix's triggers (gate.yml; Dale 2026-10-21: large-scale runs only when a full clause is
    # closed out): a push of wt2, the march branch `dev/land.sh land` pushes, whose head commit carries a
    # `Closes: C<n>` line, a gate/** push (PR #128's merge head, `bash dev/gate.sh`) and a dispatch; any
    # other wt2 push, a landing, runs nothing.
    # Every job with no `needs:` runs only under the closure predicate, gate.yml's run-name's and closure
    # job's text (L153); the pull request, whose branch every landing pushes, triggers nothing (A23E4)
    branches: ['gate/**', 'wt2']
  workflow_dispatch:

# Only the newest push per branch runs; a superseded run is cancelled. A wt2 push's run is its head's
# own group: every landing pushes wt2, and a later landing's push never cancels a closure matrix.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/wt2' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Commit messages and the PR body describe the change for humans:
  # transcript links, tool footers and agent-directed text never land
  # (dev/hooks/commit-msg strips them locally; this is the gate).
  message-hygiene:
    if: >-
      ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/heads/gate/') || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C0', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C1', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C2', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C3', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C4', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C5', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C6', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C7', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C8', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C9', fromJSON('"\n"'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No transcript links or tool footers in commits or the PR body
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          pat='claude\.ai/code/session|^Claude-Session:|Generated with \[?Claude Code'
          bad=$(git log --format='%H %s%n%b' origin/main..HEAD | grep -nE "$pat" || true)
          if [ -n "$bad" ]; then echo "forbidden text in commit messages:"; echo "$bad"; exit 1; fi
          if printf '%s' "$PR_BODY" | grep -qE "$pat"; then echo "forbidden text in the PR body"; exit 1; fi
          # dev/CHARTER.md rule 3: every commit from the charter's adoption on names its clause(s)
          c=$(git log --diff-filter=A --format=%H -- dev/CHARTER.md | tail -1)
          if [ -n "$c" ]; then
            miss=""
            for h in $(git rev-list --no-merges "$c^..HEAD"); do
              git log -1 --format=%B "$h" | grep -qE '^Charter: C[0-9]+' || miss="$miss $(git log -1 --format='%h %s' "$h")"$'\n'
            done
            if [ -n "$miss" ]; then echo "commits without a 'Charter: C<n>' trailer:"; printf '%s' "$miss"; exit 1; fi
          fi
          # one Co-Authored-By trailer per commit, from the commit that put the rule in dev/hooks/commit-msg on (A35E4)
          c=$(git log --format=%H -S'Co-Authored-By trailers; a commit carries one' -- dev/hooks/commit-msg | tail -1)
          if [ -n "$c" ]; then
            dup=""
            for h in $(git rev-list --no-merges "$c^..HEAD"); do
              n=$(git log -1 --format=%B "$h" | grep -ciE '^[[:space:]]*Co-Authored-By:' || true)
              [ "$n" -gt 1 ] && dup="$dup $(git log -1 --format='%h %s' "$h")"$'\n'
            done
            if [ -n "$dup" ]; then echo "commits with more than one Co-Authored-By trailer:"; printf '%s' "$dup"; exit 1; fi
          fi
          echo "clean: $(git rev-list --count origin/main..HEAD) commits"

  test:
    if: >-
      ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/heads/gate/') || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C0', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C1', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C2', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C3', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C4', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C5', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C6', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C7', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C8', fromJSON('"\n"'))) || contains(format('{0}{1}', fromJSON('"\n"'), github.event.head_commit.message), format('{0}Closes: C9', fromJSON('"\n"'))) }}
    # A hung worker must SELF-KILL, not sit on GitHub's 6-hour default: every slice is an
    # independently bounded job, the inner-loop lanes and the suite (test/runtests.jl's QA families).
    timeout-minutes: ${{ matrix.target.os == 'windows-latest' && 70 || 110 }}
    name: Julia ${{ matrix.version }} - ${{ matrix.target.os }} - ${{ matrix.target.slice }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
          # ~1.13.0-0 admits prereleases (rc) until 1.13.0 final lands
          - '~1.13.0-0'
        target:
          - { os: ubuntu-latest, slice: lanes, shard: '' }
          - { os: ubuntu-latest, slice: suite, shard: '' }
          - { os: macos-latest, slice: lanes, shard: '' }
          - { os: macos-latest, slice: suite, shard: '' }
          - { os: windows-latest, slice: suite, shard: '' }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # L148 checks the audit log against the commit history

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Prebuilt binary (seconds) instead of `cargo install wasm-tools`, which
      # compiled wasm-tools from source on every job (~5-10 min x 6 matrix jobs,
      # never cached). Matches what downstream.yml already uses.
      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: Install dependencies
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.instantiate()
          '

      # The dart-lang/sdk files src/ cites, at the pinned commit, for L132 (every parity
      # anchor resolves). The ratchet runs in the lanes and in the Pkg.test shard its QA
      # family is dealt to (runtests.jl's _wt_qa).
      - name: Pinned dart2wasm sources
        shell: bash
        run: bash dev/fetch_dart_sdk.sh

      # The inner-loop lanes, on both Julia versions: the differential smoke
      # corpus (the 1.13 reduce miscompile lived only here — Pkg.test never
      # saw it), the structural ratchet, and — on 1.12, whose typed IR the
      # baseline records — byte identity of the probe corpus.
      - name: Inner-loop lanes
        if: matrix.target.slice == 'lanes'
        run: |
          julia --project=. test/smoke.jl
          julia --project=. test/parity_ratchet.jl
          if [ "${{ matrix.version }}" = "1.12" ]; then julia --project=. test/probe_bytes.jl; fi

      - name: Run tests
        if: matrix.target.slice != 'lanes'
        env:
          WT_SHARD: ${{ matrix.target.shard }}
          # wasm-tools validation of every compiled module (module bytes are
          # platform-independent, so Unix coverage validates the corpus;
          # Windows stays off to protect its 45-minute shard budget).
          WT_VALIDATE: ${{ matrix.target.os == 'windows-latest' && '' || '1' }}
        run: |
          julia --project=. -e 'using Pkg; Pkg.test()'
