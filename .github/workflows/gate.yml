name: Gate
# The gate before a push, on CI's runners (AGENTS.md; dev/CHARTER.md C10): every lane of
# `bash dev/lanes.sh`'s default run, one job each, each through `dev/lanes.sh --lane <name>
# [--part i/N]`, so the commands are the script's: `julia` 1.12 and `julia +1.13` (juliaup, as
# the script calls them), Node from ci.yml's node-version, wasm-tools, Java 17 for TLC. The
# first red job cancels the rest (fail-fast), as the script stops at the first red lane.
# `bash dev/gate.sh` pushes a commit to gate/<name> and prints the verdict; ci.yml and
# formal.yml do not run on gate/**. The parts are sized from measured job times (each lane's
# work under ~12 min on ubuntu-latest): smoke in 2 parts per version, registry coverage in 2 (and
# a merge job for its verdict), TLC in 5 (every instance, formal.yml's push coverage; run_tlc.sh
# deals the instances round-robin, and at 5 the two largest, ExceptionStackDeep and
# ExceptionStackValueIdentityBroken, land apart: on this matrix's five admitting runs (37946203694,
# 37948929153, 37951909500, 37954364984, 37957078745) the parts took 0/5 561-568 s, 1/5 260-437 s,
# 2/5 630-900 s, 3/5 152-260 s, 4/5 260-310 s, where 2 parts were 598/1453 s), the suite in 6 shards (WT_VALIDATE=1), the fuzz pass in 5: 24 jobs,
# four past the account's 20 at once. The suite and the fuzz pass went from 5 and 4 to 6 and 5
# when a gate run with cold caches (a new gate branch: 136 packages precompiled in 323-466 s per
# job) cut suite 1/5 and fuzz 2/4 at the budget (run 37943322602). Measured runs: resume notes
# bgate/runs.md.
# The budget B = 20 minutes per lane job (L162; Dale 2026-10-09, the gate "~15-20 min"): the lane
# job's timeout, so a lane past it is cut and red and fail-fast cancels the rest; dev/gate.sh
# reads B from here and names a job past it. B is admitted by five consecutive green runs on
# this matrix, cold-cache runs (a new gate branch) among them, each with every lane job
# <= 0.95 B = 1140 s; the commit that set B names them. Run 37930172953 (fuzz 1/4 1148 s) forced
# the fuzz parts' re-dealing, and run 37943322602 (cold caches, cut at B) the 6 suite shards and
# 5 fuzz parts. B is lowered, never raised: a lane past it is split or rebalanced first.
on:
  push:
    branches: ['gate/**']
  workflow_dispatch:

# Only the newest push per gate branch runs; a superseded run is cancelled.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write   # a red job cancels the run; the depot and TLC verdicts are read as artifacts

defaults:
  run:
    shell: bash

# Julia's own multi-target list (its release sysimage's): a package image compiled on one runner
# CPU model loads on every other, so one published depot serves every job (dev/ci_depot.sh)
env:
  JULIA_CPU_TARGET: 'generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1);x86-64-v4,-rdrnd,base(1)'

jobs:
  lane:
    name: ${{ matrix.lane }}${{ matrix.part != '' && format(' {0}', matrix.part) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20   # the budget B (header): a slow lane and a hung one are cut at it, red
    strategy:
      fail-fast: true
      matrix:
        include:
          - { lane: ratchet, part: '' }
          - { lane: smoke, part: '0/2' }
          - { lane: smoke, part: '1/2' }
          - { lane: smoke-1.13, part: '0/2' }
          - { lane: smoke-1.13, part: '1/2' }
          - { lane: probes, part: '' }
          - { lane: coverage, part: '0/2' }
          - { lane: coverage, part: '1/2' }
          - { lane: formal, part: '2/5' }
          - { lane: suite, part: '0/6' }
          - { lane: suite, part: '1/6' }
          - { lane: suite, part: '2/6' }
          - { lane: suite, part: '3/6' }
          - { lane: suite, part: '4/6' }
          - { lane: suite, part: '5/6' }
          - { lane: fuzz, part: '0/5' }
          - { lane: fuzz, part: '1/5' }
          - { lane: fuzz, part: '2/5' }
          - { lane: fuzz, part: '3/5' }
          - { lane: fuzz, part: '4/5' }
          # the four shortest TLC parts last (0/5, 1/5, 3/5, 4/5: 152-568 s on the admitting runs): past the account's 20 at once,
          # they wait for the first free runners (the ratchet's after ~1 min, then the probes')
          - { lane: formal, part: '3/5' }
          - { lane: formal, part: '4/5' }
          - { lane: formal, part: '1/5' }
          - { lane: formal, part: '0/5' }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # L148 checks the audit log against the commit history

      # the wasm engine is CI's: the Node major ci.yml's node-version names (dev/lanes.sh reads
      # the same line and fails a lane on any other major)
      - name: CI's Node major
        id: ci
        run: |
          echo "node=$(sed -n "s/^ *node-version: *'\{0,1\}\([0-9][0-9]*\).*/\1/p" .github/workflows/ci.yml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.ci.outputs.node }}

      - uses: actions/setup-java@v4
        if: matrix.lane == 'formal'
        with: { distribution: temurin, java-version: '17' }

      # juliaup, so `julia` is 1.12 and `julia +1.13` is 1.13, the two commands dev/lanes.sh runs;
      # each download retried (a timed-out Julia download failed a whole run, 37890994081)
      - name: Julia (juliaup)
        if: matrix.lane != 'formal'
        run: |
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "attempt $i failed: $*"; sleep 15; done; return 1; }
          J="$HOME/.juliaup/bin/juliaup"
          channel() { "$J" status | awk 'NR > 2 { print ($1 == "*") ? $2 : $1 }' | grep -x "$1" >/dev/null || retry "$J" add "$1"; }
          [ -x "$J" ] || retry sh -c 'curl -fsSL https://install.julialang.org | sh -s -- --yes --default-channel 1.12'
          channel 1.12 && "$J" default 1.12
          if [ "${{ matrix.lane }}" = smoke-1.13 ]; then channel 1.13; fi
          echo "$HOME/.juliaup/bin" >> "$GITHUB_PATH"

      # the package under test precompiles without its PrecompileTools workload (~10 s, not
      # ~212 s: run 39491700858), and the workload's signatures compile in their own suite
      # family, test/precompile_workload.jl
      - name: Workload off
        if: matrix.lane != 'formal'
        run: printf '[WasmTarget]\nprecompile_workload = false\n' > LocalPreferences.toml

      # the dependencies' packages and images a previous gate run published, repository-wide
      # (dev/ci_depot.sh): the suite and fuzz jobs Pkg.test's environment, the others the
      # package alone, smoke-1.13 on its own Julia
      - name: Depot
        if: matrix.lane != 'formal'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash dev/ci_depot.sh restore ${{ (matrix.lane == 'suite' || matrix.lane == 'fuzz') && 'suite' || (matrix.lane == 'smoke-1.13' && 'lanes-1.13' || 'lanes') }}

      - name: Install wasm-tools
        if: matrix.lane != 'formal'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      # instantiate only: each lane precompiles in its own configuration (Pkg.test's differs)
      - name: Install dependencies
        if: matrix.lane != 'formal'
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: ${{ matrix.lane == 'smoke-1.13' && 'julia +1.13' || 'julia' }} --project=. -e 'using Pkg; Pkg.instantiate()'

      # the dart-lang/sdk files src/ cites, for L132 (the ratchet lane, and the suite shard the
      # ratchet's family is dealt to)
      - name: Pinned dart2wasm sources
        if: matrix.lane == 'ratchet' || matrix.lane == 'suite'
        run: bash dev/fetch_dart_sdk.sh

      # a formal part whose models, instances, lane and Java hash as a green part's did keeps
      # that part's verdict (dev/tlc_verdict.sh); any change runs it
      - name: TLC verdict by content
        if: matrix.lane == 'formal'
        id: tlc
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash dev/tlc_verdict.sh lookup ${{ matrix.part }}

      - name: dev/lanes.sh --lane ${{ matrix.lane }}${{ matrix.part != '' && format(' --part {0}', matrix.part) || '' }}
        if: matrix.lane != 'formal' || steps.tlc.outputs.hit != 'true'
        run: |
          # the job's stdout can be a non-blocking pipe, where one large write fails part-way
          # ("echo: write error: Resource temporarily unavailable": 37893727231 lost a shard's log)
          python3 -c 'import os; os.set_blocking(1, True); os.set_blocking(2, True)'
          bash dev/lanes.sh --lane ${{ matrix.lane }}${{ matrix.part != '' && format(' --part {0}', matrix.part) || '' }}${{ matrix.lane == 'formal' && ' --all' || '' }}

      # a part model checked green publishes its verdict under its content's name
      - name: TLC verdict record
        if: matrix.lane == 'formal' && steps.tlc.outputs.hit != 'true'
        id: tlcrec
        run: bash dev/tlc_verdict.sh record ${{ matrix.part }} tlc-verdict
      - uses: actions/upload-artifact@v4
        if: matrix.lane == 'formal' && steps.tlc.outputs.hit != 'true'
        with:
          name: ${{ steps.tlcrec.outputs.name }}
          path: tlc-verdict/verdict.txt
          if-no-files-found: error
          retention-days: 90

      # a coverage part's units and hits, for the merge job's verdict
      - uses: actions/upload-artifact@v4
        if: matrix.lane == 'coverage'
        with:
          name: coverage-part-${{ strategy.job-index }}
          path: coverage-parts/
          if-no-files-found: error
          retention-days: 1

      # smoke on 1.12's part of the emission-diff check's head side (L190), for the emission job
      - uses: actions/upload-artifact@v4
        if: matrix.lane == 'smoke'
        with:
          name: emission-smoke-${{ strategy.job-index }}
          path: emission-parts/
          if-no-files-found: error
          retention-days: 1

      # one job per depot publishes it when it compiled a dependency image the restored depot
      # lacked (a new dependency version, a first run): the probes for the package alone, part 0
      # of the suite for Pkg.test's environment, part 0 of smoke-1.13 for Julia 1.13
      - name: Depot to publish
        id: depot
        if: (matrix.lane == 'probes' || (matrix.lane == 'suite' && startsWith(matrix.part, '0/')) || (matrix.lane == 'smoke-1.13' && startsWith(matrix.part, '0/')))
        run: bash dev/ci_depot.sh save ${{ matrix.lane == 'suite' && 'suite' || (matrix.lane == 'smoke-1.13' && 'lanes-1.13' || 'lanes') }} depot-out
      - uses: actions/upload-artifact@v4
        if: steps.depot.outputs.save == 'true'
        with:
          name: ${{ steps.depot.outputs.name }}
          path: depot-out/depot.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      # a red lane cancels the run: fail-fast cancels the other lanes, this the jobs beside them
      - name: Cancel the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # registry coverage's verdict on the union of its parts (dev/lanes.sh --lane coverage --merge);
  # it loads no package, so it needs only the script's Julia and Node
  coverage-merge:
    needs: lane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: CI's Node major
        id: ci
        run: |
          echo "node=$(sed -n "s/^ *node-version: *'\{0,1\}\([0-9][0-9]*\).*/\1/p" .github/workflows/ci.yml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.ci.outputs.node }}
      - name: Julia (juliaup)
        run: |
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "attempt $i failed: $*"; sleep 15; done; return 1; }
          J="$HOME/.juliaup/bin/juliaup"
          channel() { "$J" status | awk 'NR > 2 { print ($1 == "*") ? $2 : $1 }' | grep -x "$1" >/dev/null || retry "$J" add "$1"; }
          [ -x "$J" ] || retry sh -c 'curl -fsSL https://install.julialang.org | sh -s -- --yes --default-channel 1.12'
          channel 1.12 && "$J" default 1.12
          echo "$HOME/.juliaup/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-part-*
          path: coverage-parts
          merge-multiple: true
      - name: dev/lanes.sh --lane coverage --merge
        run: |
          python3 -c 'import os; os.set_blocking(1, True); os.set_blocking(2, True)'
          bash dev/lanes.sh --lane coverage --merge

  # The emission-diff check (dev/emission_diff.sh, test/emission_fingerprint.jl, L190) gates the
  # landing too: its base side beside the lanes (the merge base's published base file and the cases
  # it lacks, compiled by the base's src), its verdict over smoke 1.12's parts; on a green verdict
  # the commit's own smoke rows are published as its base file (90 days), which every later batch
  # on this commit reads
  emission-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # the budget B
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the merge base with the march branch
      - name: CI's Node major
        id: ci
        run: |
          echo "node=$(sed -n "s/^ *node-version: *'\{0,1\}\([0-9][0-9]*\).*/\1/p" .github/workflows/ci.yml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.ci.outputs.node }}
      - name: Julia (juliaup)
        run: |
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "attempt $i failed: $*"; sleep 15; done; return 1; }
          J="$HOME/.juliaup/bin/juliaup"
          channel() { "$J" status | awk 'NR > 2 { print ($1 == "*") ? $2 : $1 }' | grep -x "$1" >/dev/null || retry "$J" add "$1"; }
          [ -x "$J" ] || retry sh -c 'curl -fsSL https://install.julialang.org | sh -s -- --yes --default-channel 1.12'
          channel 1.12 && "$J" default 1.12
          echo "$HOME/.juliaup/bin" >> "$GITHUB_PATH"
      - name: Workload off
        run: printf '[WasmTarget]\nprecompile_workload = false\n' > LocalPreferences.toml
      - name: Depot
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash dev/ci_depot.sh restore lanes
      - name: dev/emission_diff.sh plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import os; os.set_blocking(1, True); os.set_blocking(2, True)'
          bash dev/emission_diff.sh plan emission-plan
      - uses: actions/upload-artifact@v4
        with:
          name: emission-plan
          path: emission-plan/
          if-no-files-found: error
          retention-days: 1
      - name: Cancel the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  emission:
    needs: [lane, emission-plan]
    if: ${{ !cancelled() && needs.lane.result == 'success' && needs.emission-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Julia (juliaup)
        run: |
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "attempt $i failed: $*"; sleep 15; done; return 1; }
          J="$HOME/.juliaup/bin/juliaup"
          channel() { "$J" status | awk 'NR > 2 { print ($1 == "*") ? $2 : $1 }' | grep -x "$1" >/dev/null || retry "$J" add "$1"; }
          [ -x "$J" ] || retry sh -c 'curl -fsSL https://install.julialang.org | sh -s -- --yes --default-channel 1.12'
          channel 1.12 && "$J" default 1.12
          echo "$HOME/.juliaup/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          pattern: emission-*
          path: emission-parts
          merge-multiple: true
      - name: dev/emission_diff.sh merge
        run: bash dev/emission_diff.sh merge emission-parts
      - name: dev/emission_diff.sh publish
        id: publish
        run: |
          bash dev/emission_diff.sh publish emission-parts emission-base | tee publish.log
          grep '^name=' publish.log >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.publish.outputs.name }}
          path: emission-base/base.tsv
          if-no-files-found: error
          retention-days: 90
