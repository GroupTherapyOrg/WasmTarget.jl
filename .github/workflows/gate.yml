name: Gate
# THROWAWAY measurement workflow (eff-pipeline experiment 1), never landed.
on:
  push:
    branches: ['gate/**']
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
defaults:
  run:
    shell: bash
env:
  MT: 'generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1);x86-64-v4,-rdrnd,base(1)'
jobs:
  build:
    name: build ${{ matrix.cfg }} wl=${{ matrix.wl }} ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cfg: lanes, wl: 'on',  target: mt }
          - { cfg: lanes, wl: 'off', target: mt }
          - { cfg: test,  wl: 'on',  target: mt }
          - { cfg: test,  wl: 'off', target: mt }
          - { cfg: lanes, wl: 'on',  target: generic }
    steps:
      - uses: actions/checkout@v4
      - name: Julia (juliaup)
        run: |
          curl -fsSL https://install.julialang.org | sh -s -- --yes --default-channel 1.12
          echo "$HOME/.juliaup/bin" >> "$GITHUB_PATH"
      - name: target
        run: |
          if [ "${{ matrix.target }}" = mt ]; then echo "JULIA_CPU_TARGET=$MT" >> "$GITHUB_ENV"; else echo "JULIA_CPU_TARGET=generic" >> "$GITHUB_ENV"; fi
          if [ "${{ matrix.wl }}" = off ]; then printf '[WasmTarget]\nprecompile_workload = false\n' > LocalPreferences.toml; fi
          sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | head -1
      - run: julia -e 'println(Base.current_image_targets()); println(Sys.CPU_NAME); println(unsafe_string(Base.JLOptions().cpu_target))'
      - name: instantiate
        env: { JULIA_PKG_PRECOMPILE_AUTO: '0' }
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: precompile (lanes)
        if: matrix.cfg == 'lanes'
        run: time julia --project=. -e 'using Pkg; Pkg.precompile(); using WasmTarget, Random, SHA, LinearAlgebra, Dates'
      - name: precompile (test)
        if: matrix.cfg == 'test'
        env: { WT_PHASE: 'Phase 10: JavaScript Imports' }
        run: time julia --project=. -e 'using Pkg; Pkg.test()'
      - run: du -sh ~/.julia ~/.julia/compiled ~/.julia/juliaup ~/.julia/packages ~/.julia/artifacts || true
      - uses: actions/cache/save@v4
        with:
          path: ~/.julia
          key: effexp-${{ github.run_id }}-${{ matrix.cfg }}-${{ matrix.wl }}-${{ matrix.target }}

  run:
    name: run ${{ matrix.lane }} ${{ matrix.part }} ${{ matrix.cfg }} wl=${{ matrix.wl }} ${{ matrix.target }} ${{ matrix.copy }}
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # native, cold, as today (control) and without the workload
          - { mode: cold, cfg: lanes, wl: 'on',  target: native, lane: smoke, part: '3/10', copy: a }
          - { mode: cold, cfg: lanes, wl: 'off', target: native, lane: smoke, part: '3/10', copy: a }
          - { mode: cold, cfg: test,  wl: 'on',  target: native, lane: suite, part: '2/6', copy: a }
          - { mode: cold, cfg: test,  wl: 'off', target: native, lane: suite, part: '2/6', copy: a }
          # restored from the build job's depot
          - { mode: warm, cfg: lanes, wl: 'on',  target: mt, lane: smoke, part: '3/10', copy: a }
          - { mode: warm, cfg: lanes, wl: 'on',  target: mt, lane: smoke, part: '3/10', copy: b }
          - { mode: warm, cfg: lanes, wl: 'on',  target: mt, lane: smoke, part: '3/10', copy: c }
          - { mode: warm, cfg: lanes, wl: 'on',  target: generic, lane: smoke, part: '3/10', copy: a }
          - { mode: warm, cfg: lanes, wl: 'off', target: mt, lane: smoke, part: '3/10', copy: a }
          - { mode: warm, cfg: test,  wl: 'on',  target: mt, lane: suite, part: '2/6', copy: a }
          - { mode: warm, cfg: test,  wl: 'on',  target: mt, lane: suite, part: '2/6', copy: b }
          - { mode: warm, cfg: test,  wl: 'off', target: mt, lane: suite, part: '2/6', copy: a }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/cache/restore@v4
        if: matrix.mode == 'warm'
        with:
          path: ~/.julia
          key: effexp-${{ github.run_id }}-${{ matrix.cfg }}-${{ matrix.wl }}-${{ matrix.target }}
          fail-on-cache-miss: true
      - name: Julia (juliaup)
        run: |
          [ -x "$HOME/.juliaup/bin/juliaup" ] || curl -fsSL https://install.julialang.org | sh -s -- --yes --default-channel 1.12
          echo "$HOME/.juliaup/bin" >> "$GITHUB_PATH"
      - name: target
        run: |
          if [ "${{ matrix.target }}" = mt ]; then echo "JULIA_CPU_TARGET=$MT" >> "$GITHUB_ENV"; elif [ "${{ matrix.target }}" = generic ]; then echo "JULIA_CPU_TARGET=generic" >> "$GITHUB_ENV"; fi
          if [ "${{ matrix.wl }}" = off ]; then printf '[WasmTarget]\nprecompile_workload = false\n' > LocalPreferences.toml; fi
          echo "CPU: $(sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | head -1)"
      - uses: taiki-e/install-action@v2
        with: { tool: wasm-tools }
      - name: instantiate
        env: { JULIA_PKG_PRECOMPILE_AUTO: '0' }
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: bash dev/fetch_dart_sdk.sh
        if: matrix.lane == 'suite'
      - name: lane
        run: |
          python3 -c 'import os; os.set_blocking(1, True); os.set_blocking(2, True)'
          touch /tmp/marker
          s=$(date +%s)
          bash dev/lanes.sh --lane ${{ matrix.lane }} --part ${{ matrix.part }} || r=$?
          echo "EFF lane seconds $(( $(date +%s) - s ))"
          echo "EFF new cache files: $(find ~/.julia/compiled -name '*.ji' -newer /tmp/marker | wc -l)"
          find ~/.julia/compiled -name '*.ji' -newer /tmp/marker | head -20
          exit ${r:-0}
