name: Gate
# The gate on CI's runners (AGENTS.md; dev/CHARTER.md C10), and the one run a landing needs:
# `bash dev/land.sh merge` lands a branch head only on this workflow's green gate/** run of that
# exact commit (ci.yml and formal.yml no longer run on a march/** push).
#
# A gate/** push (`bash dev/gate.sh`) runs every lane of `bash dev/lanes.sh`'s default run, one
# job per part, each through `dev/lanes.sh --lane <name> [--part i/N] [--procs P]`, so the commands
# are the script's: `julia` 1.12 and `julia +1.13` (juliaup, as the script calls them), Node from
# ci.yml's node-version, wasm-tools, Java 17 for TLC; and beside them ci.yml itself (a reusable
# call, `gated: true`), its matrix less the ubuntu Julia 1.12 jobs these lanes run (L153), so
# CI's 1.13 suite, macOS and Windows gate the landing as they did on the march/** push. A
# gate-fast/** push (`bash dev/gate.sh --fast`, the inner loop, L163) runs only the fast job (the
# ratchet and smoke on 1.12 and 1.13) and the emission-diff check. The fast job is first in the
# file and in its matrix, so it takes the first runners; `bash dev/gate.sh` prints its verdict,
# `FAST green` or `FAST red`, as soon as it is done, and the full verdict after. The first red
# job cancels the run (fail-fast, and each job's `Cancel the run` step).
#
# What each job does before its lane (L193): the package under test precompiles without its
# PrecompileTools workload (~10 s, not ~212 s; the workload's signatures compile in their own
# suite family, test/precompile_workload.jl), except in the probes job, which keeps the workload
# on so the image a user loads is compiled and its emission checked byte for byte; the
# dependencies' packages and images come from the depot a previous gate run published
# (dev/ci_depot.sh, repository-wide: a cache stays on its branch, and every batch gates on a new
# one); a TLC part whose inputs hash as a green part's did keeps that verdict (dev/tlc_verdict.sh).
# Each split lane runs its part as P concurrent processes (`--procs`), one per core of the
# runner (one lane process kept one of four busy).
#
# The parts are sized from measured job times: the fast job's smoke in N = 6 and M = 5 parts
# (smoke and smoke-1.13), each as P = 4 processes. The budget B = 20 minutes per lane job (L162;
# Dale 2026-10-09, the gate "~15-20 min"), B_fast = 9 minutes per fast job (L163): each job's
# timeout, so a slow lane and a hung one are cut and red and fail-fast cancels the rest;
# dev/gate.sh reads both here and names a job past its budget. B is lowered, never raised: a lane
# past it is split or rebalanced first. Measured runs: resume notes bgate/runs.md.
on:
  push:
    branches: ['gate/**', 'gate-fast/**']
  workflow_dispatch:

# Only the newest push per gate branch runs; a superseded run is cancelled.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write   # a red job cancels the run; the depot and TLC verdicts are read as artifacts

defaults:
  run:
    shell: bash

# Julia's own multi-target list (its release sysimage's): a package image compiled on one runner
# CPU model loads on every other, so one published depot serves every job (dev/ci_depot.sh)
env:
  JULIA_CPU_TARGET: 'generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1);x86-64-v4,-rdrnd,base(1)'

jobs:
  # the inner loop's lanes: the ratchet and smoke on Julia 1.12 and 1.13
  fast:
    name: ${{ matrix.lane }}${{ matrix.part != '' && format(' {0}', matrix.part) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9   # the budget B_fast (header); dev/gate.sh reads it here
    strategy:
      fail-fast: true
      matrix:
        include:
          - { lane: ratchet, part: '', procs: '' }
          - { lane: smoke, part: '0/6', procs: '4' }
          - { lane: smoke, part: '1/6', procs: '4' }
          - { lane: smoke, part: '2/6', procs: '4' }
          - { lane: smoke, part: '3/6', procs: '4' }
          - { lane: smoke, part: '4/6', procs: '4' }
          - { lane: smoke, part: '5/6', procs: '4' }
          - { lane: smoke-1.13, part: '0/5', procs: '4' }
          - { lane: smoke-1.13, part: '1/5', procs: '4' }
          - { lane: smoke-1.13, part: '2/5', procs: '4' }
          - { lane: smoke-1.13, part: '3/5', procs: '4' }
          - { lane: smoke-1.13, part: '4/5', procs: '4' }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # L148 checks the audit log against the commit history

      # the wasm engine is CI's: the Node major ci.yml's node-version names (dev/lanes.sh reads
      # the same line and fails a lane on any other major)
      - name: CI's Node major
        id: ci
        run: |
          echo "node=$(sed -n "s/^ *node-version: *'\{0,1\}\([0-9][0-9]*\).*/\1/p" .github/workflows/ci.yml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.ci.outputs.node }}

      # juliaup, so `julia` is 1.12 and `julia +1.13` is 1.13, the two commands dev/lanes.sh runs;
      # each download retried (a timed-out Julia download failed a whole run, 37890994081)
      - name: Julia (juliaup)
        run: |
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "attempt $i failed: $*"; sleep 15; done; return 1; }
          J="$HOME/.juliaup/bin/juliaup"
          channel() { "$J" status | awk 'NR > 2 { print ($1 == "*") ? $2 : $1 }' | grep -x "$1" >/dev/null || retry "$J" add "$1"; }
          [ -x "$J" ] || retry sh -c 'curl -fsSL https://install.julialang.org | sh -s -- --yes --default-channel 1.12'
          channel 1.12 && "$J" default 1.12
          if [ "${{ matrix.lane }}" = smoke-1.13 ]; then channel 1.13; fi
          echo "$HOME/.juliaup/bin" >> "$GITHUB_PATH"

      - name: Workload off
        run: printf '[WasmTarget]\nprecompile_workload = false\n' > LocalPreferences.toml
      - name: Depot
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash dev/ci_depot.sh restore lanes ${{ matrix.lane == 'smoke-1.13' && '+1.13' || '' }}

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      # instantiate only: each lane precompiles in its own configuration (Pkg.test's differs)
      - name: Install dependencies
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: ${{ matrix.lane == 'smoke-1.13' && 'julia +1.13' || 'julia' }} --project=. -e 'using Pkg; Pkg.instantiate()'

      # the dart-lang/sdk files src/ cites, for L132 (the ratchet lane)
      - name: Pinned dart2wasm sources
        if: matrix.lane == 'ratchet'
        run: bash dev/fetch_dart_sdk.sh

      - name: dev/lanes.sh --lane ${{ matrix.lane }}${{ matrix.part != '' && format(' --part {0}', matrix.part) || '' }}
        run: |
          # the job's stdout can be a non-blocking pipe, where one large write fails part-way
          # ("echo: write error: Resource temporarily unavailable": 37893727231 lost a shard's log)
          python3 -c 'import os; os.set_blocking(1, True); os.set_blocking(2, True)'
          bash dev/lanes.sh --lane ${{ matrix.lane }}${{ matrix.part != '' && format(' --part {0}', matrix.part) || '' }}${{ matrix.procs != '' && format(' --procs {0}', matrix.procs) || '' }}

      # smoke on 1.12's parts of the emission-diff check's head side (L190), for the emission job
      - uses: actions/upload-artifact@v4
        if: matrix.lane == 'smoke'
        with:
          name: emission-smoke-${{ strategy.job-index }}
          path: emission-parts/
          if-no-files-found: error
          retention-days: 1

      # one job per depot publishes it when it compiled a dependency image the restored depot
      # lacked (a new dependency version, a first run): part 0 of each smoke for its Julia
      - name: Depot to publish
        id: depot
        if: (matrix.lane == 'smoke' || matrix.lane == 'smoke-1.13') && startsWith(matrix.part, '0/')
        run: bash dev/ci_depot.sh save lanes depot-out ${{ matrix.lane == 'smoke-1.13' && '+1.13' || '' }}
      - uses: actions/upload-artifact@v4
        if: steps.depot.outputs.save == 'true'
        with:
          name: ${{ steps.depot.outputs.name }}
          path: depot-out/depot.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      # a red lane cancels the run: fail-fast cancels this job's matrix, this every other job
      - name: Cancel the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # The emission-diff check's base side (dev/emission_diff.sh plan; dev/CHARTER.md C5, L190): the
  # merge base, whether the tree differs from it, its published base file and the cases that file
  # lacks, compiled by the base's src, beside the lanes
  emission-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 9   # B_fast
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the merge base with the march branch
      - name: CI's Node major
        id: ci
        run: |
          echo "node=$(sed -n "s/^ *node-version: *'\{0,1\}\([0-9][0-9]*\).*/\1/p" .github/workflows/ci.yml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.ci.outputs.node }}
      - name: Julia (juliaup)
        run: |
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "attempt $i failed: $*"; sleep 15; done; return 1; }
          J="$HOME/.juliaup/bin/juliaup"
          channel() { "$J" status | awk 'NR > 2 { print ($1 == "*") ? $2 : $1 }' | grep -x "$1" >/dev/null || retry "$J" add "$1"; }
          [ -x "$J" ] || retry sh -c 'curl -fsSL https://install.julialang.org | sh -s -- --yes --default-channel 1.12'
          channel 1.12 && "$J" default 1.12
          echo "$HOME/.juliaup/bin" >> "$GITHUB_PATH"
      - name: Workload off
        run: printf '[WasmTarget]\nprecompile_workload = false\n' > LocalPreferences.toml
      - name: Depot
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash dev/ci_depot.sh restore lanes
      - name: dev/emission_diff.sh plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import os; os.set_blocking(1, True); os.set_blocking(2, True)'
          bash dev/emission_diff.sh plan emission-plan
      - uses: actions/upload-artifact@v4
        with:
          name: emission-plan
          path: emission-plan/
          if-no-files-found: error
          retention-days: 1
      - name: Cancel the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # every other lane of the default run (a gate/** push only)
  lane:
    if: startsWith(github.ref, 'refs/heads/gate/')
    name: ${{ matrix.lane }}${{ matrix.part != '' && format(' {0}', matrix.part) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20   # the budget B (header): a slow lane and a hung one are cut at it, red
    strategy:
      fail-fast: true
      matrix:
        include:
          - { lane: probes, part: '', procs: '' }
          - { lane: fuzz, part: '0/6', procs: '2' }
          - { lane: fuzz, part: '1/6', procs: '2' }
          - { lane: fuzz, part: '2/6', procs: '2' }
          - { lane: fuzz, part: '3/6', procs: '2' }
          - { lane: fuzz, part: '4/6', procs: '2' }
          - { lane: fuzz, part: '5/6', procs: '2' }
          - { lane: suite, part: '0/4', procs: '4' }
          - { lane: suite, part: '1/4', procs: '4' }
          - { lane: suite, part: '2/4', procs: '4' }
          - { lane: suite, part: '3/4', procs: '4' }
          - { lane: coverage, part: '0/2', procs: '4' }
          - { lane: coverage, part: '1/2', procs: '4' }
          - { lane: formal, part: '2/5', procs: '' }
          - { lane: formal, part: '0/5', procs: '' }
          - { lane: formal, part: '1/5', procs: '' }
          - { lane: formal, part: '3/5', procs: '' }
          - { lane: formal, part: '4/5', procs: '' }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # L148 checks the audit log against the commit history

      - name: CI's Node major
        id: ci
        run: |
          echo "node=$(sed -n "s/^ *node-version: *'\{0,1\}\([0-9][0-9]*\).*/\1/p" .github/workflows/ci.yml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.ci.outputs.node }}

      - uses: actions/setup-java@v4
        if: matrix.lane == 'formal'
        with: { distribution: temurin, java-version: '17' }

      - name: Julia (juliaup)
        if: matrix.lane != 'formal'
        run: |
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "attempt $i failed: $*"; sleep 15; done; return 1; }
          J="$HOME/.juliaup/bin/juliaup"
          channel() { "$J" status | awk 'NR > 2 { print ($1 == "*") ? $2 : $1 }' | grep -x "$1" >/dev/null || retry "$J" add "$1"; }
          [ -x "$J" ] || retry sh -c 'curl -fsSL https://install.julialang.org | sh -s -- --yes --default-channel 1.12'
          channel 1.12 && "$J" default 1.12
          echo "$HOME/.juliaup/bin" >> "$GITHUB_PATH"

      # the probes job keeps the workload on: the image a user loads, its emission byte for byte
      - name: Workload off
        if: matrix.lane != 'formal' && matrix.lane != 'probes'
        run: printf '[WasmTarget]\nprecompile_workload = false\n' > LocalPreferences.toml
      - name: Depot
        if: matrix.lane != 'formal'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash dev/ci_depot.sh restore ${{ (matrix.lane == 'suite' || matrix.lane == 'fuzz') && 'suite' || 'lanes' }}

      - name: Install wasm-tools
        if: matrix.lane != 'formal'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: Install dependencies
        if: matrix.lane != 'formal'
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      # the dart-lang/sdk files src/ cites, for L132 (the suite shard the ratchet's family is
      # dealt to)
      - name: Pinned dart2wasm sources
        if: matrix.lane == 'suite'
        run: bash dev/fetch_dart_sdk.sh

      # a formal part whose models, instances, lane and Java hash as a green part's did keeps
      # that part's verdict (dev/tlc_verdict.sh); any change runs it
      - name: TLC verdict by content
        if: matrix.lane == 'formal'
        id: tlc
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash dev/tlc_verdict.sh lookup ${{ matrix.part }}

      - name: dev/lanes.sh --lane ${{ matrix.lane }}${{ matrix.part != '' && format(' --part {0}', matrix.part) || '' }}
        if: matrix.lane != 'formal' || steps.tlc.outputs.hit != 'true'
        run: |
          python3 -c 'import os; os.set_blocking(1, True); os.set_blocking(2, True)'
          bash dev/lanes.sh --lane ${{ matrix.lane }}${{ matrix.part != '' && format(' --part {0}', matrix.part) || '' }}${{ matrix.procs != '' && format(' --procs {0}', matrix.procs) || '' }}${{ matrix.lane == 'formal' && ' --all' || '' }}

      # a part model checked green publishes its verdict under its content's name
      - name: TLC verdict record
        if: matrix.lane == 'formal' && steps.tlc.outputs.hit != 'true'
        id: tlcrec
        run: bash dev/tlc_verdict.sh record ${{ matrix.part }} tlc-verdict
      - uses: actions/upload-artifact@v4
        if: matrix.lane == 'formal' && steps.tlc.outputs.hit != 'true'
        with:
          name: ${{ steps.tlcrec.outputs.name }}
          path: tlc-verdict/verdict.txt
          if-no-files-found: error
          retention-days: 90

      # a coverage part's units and hits, for the merge job's verdict
      - uses: actions/upload-artifact@v4
        if: matrix.lane == 'coverage'
        with:
          name: coverage-part-${{ strategy.job-index }}
          path: coverage-parts/
          if-no-files-found: error
          retention-days: 1

      # part 0 of the suite publishes Pkg.test's depot when it compiled a dependency image the
      # restored depot lacked
      - name: Depot to publish
        id: depot
        if: matrix.lane == 'suite' && startsWith(matrix.part, '0/')
        run: bash dev/ci_depot.sh save suite depot-out
      - uses: actions/upload-artifact@v4
        if: steps.depot.outputs.save == 'true'
        with:
          name: ${{ steps.depot.outputs.name }}
          path: depot-out/depot.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Cancel the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # registry coverage's verdict on the union of its parts (dev/lanes.sh --lane coverage --merge);
  # it loads no package, so it needs only the script's Julia and Node
  coverage-merge:
    needs: lane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: CI's Node major
        id: ci
        run: |
          echo "node=$(sed -n "s/^ *node-version: *'\{0,1\}\([0-9][0-9]*\).*/\1/p" .github/workflows/ci.yml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.ci.outputs.node }}
      - name: Julia (juliaup)
        run: |
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "attempt $i failed: $*"; sleep 15; done; return 1; }
          J="$HOME/.juliaup/bin/juliaup"
          channel() { "$J" status | awk 'NR > 2 { print ($1 == "*") ? $2 : $1 }' | grep -x "$1" >/dev/null || retry "$J" add "$1"; }
          [ -x "$J" ] || retry sh -c 'curl -fsSL https://install.julialang.org | sh -s -- --yes --default-channel 1.12'
          channel 1.12 && "$J" default 1.12
          echo "$HOME/.juliaup/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-part-*
          path: coverage-parts
          merge-multiple: true
      - name: dev/lanes.sh --lane coverage --merge
        run: |
          python3 -c 'import os; os.set_blocking(1, True); os.set_blocking(2, True)'
          bash dev/lanes.sh --lane coverage --merge

  # The emission-diff check's verdict (dev/emission_diff.sh merge; L190) over smoke 1.12's parts
  # and the plan's files; on a full gate's green verdict the commit's own smoke rows are published
  # as its base file (90 days), which every later batch on this commit reads
  emission:
    needs: [fast, emission-plan, lane]
    if: ${{ !cancelled() && needs.fast.result == 'success' && needs.emission-plan.result == 'success' && (needs.lane.result == 'success' || (needs.lane.result == 'skipped' && startsWith(github.ref, 'refs/heads/gate-fast/'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Julia (juliaup)
        run: |
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "attempt $i failed: $*"; sleep 15; done; return 1; }
          J="$HOME/.juliaup/bin/juliaup"
          channel() { "$J" status | awk 'NR > 2 { print ($1 == "*") ? $2 : $1 }' | grep -x "$1" >/dev/null || retry "$J" add "$1"; }
          [ -x "$J" ] || retry sh -c 'curl -fsSL https://install.julialang.org | sh -s -- --yes --default-channel 1.12'
          channel 1.12 && "$J" default 1.12
          echo "$HOME/.juliaup/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          pattern: emission-*
          path: emission-parts
          merge-multiple: true
      - name: dev/emission_diff.sh merge
        run: bash dev/emission_diff.sh merge emission-parts
      - name: dev/emission_diff.sh publish
        if: startsWith(github.ref, 'refs/heads/gate/')
        id: publish
        run: |
          bash dev/emission_diff.sh publish emission-parts emission-base | tee publish.log
          grep '^name=' publish.log >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/heads/gate/')
        with:
          name: ${{ steps.publish.outputs.name }}
          path: emission-base/base.tsv
          if-no-files-found: error
          retention-days: 90
      - name: Cancel the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # CI's matrix (ci.yml, called), less the ubuntu Julia 1.12 jobs the lanes above run (L153):
  # message hygiene, Julia 1.13 on ubuntu, and both versions on macOS and Windows
  ci:
    if: startsWith(github.ref, 'refs/heads/gate/')
    uses: ./.github/workflows/ci.yml
    with:
      gated: true
