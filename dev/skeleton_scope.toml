# dev/skeleton_scope.toml — what of dart2wasm and wasm_builder at the pin is out of the rebuild's scope,
# each with its reason (dev/skeleton.jl reads it; dev/MARCH.md 1.A4). [out] names whole dart files: the
# in-scope files are src/julia/parity.jl's DART_FILES, the one list, and together the two name every
# dart file of both packages, a key being the path under the sdk's pkg/. [out_definitions] names a
# definition of an in-scope file (`<key> <Symbol>`; a class takes its members with it), and
# [out_types] a type (`<library> <Name>`) that takes out every definition whose parameters or
# receiver name it, as does a class [out_definitions] names. What is out has no stub and no count.
#
# The rule every row answers to (the lead's ruling; the audit checks each row against it): a row is
# one of two kinds, and its reason opens with its kind, which dev/skeleton.jl requires.
#   scope: a dev/PARITY_MASTER.md scope exclusion (deferred loading, the deserializer and printer,
#          tasks, dart:ffi, the command-line driver), naming it;
#   julia: a Kernel front-end or pipeline step that Julia's lowering, inference or trim verifier
#          replaces, naming the Julia step.
# Codegen and runtime structures are never out, even where Julia's answer leaves them empty: they are
# ported (Dale's 100% goal), and moving a definition out of the total never stands in for porting it.
