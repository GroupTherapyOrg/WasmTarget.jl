# dev/timing_best.toml — the blocking gate's budgets and timing ratchet (dev/block.jl, `bash
# dev/gate.sh --block`; dev/CHARTER.md C10, L194, L195). [budget]: wall seconds, the whole run
# (`total`) and each stage, the core's median smoke case (`case-median`), each a target whose band
# is dev/block.jl's BUDGET_BAND times it (over the budget a note, past the band red); a budget is lowered, never
# raised (dev/block.jl holds every budget and best to the change's base's): a stage past it is split
# or made faster first; `<stage>@warm` is a stage's budget under
# the warm runner (`--warm`), where it has one. [best]: each ratcheted stage's best wall
# seconds at the machine's best speed, and `calibration`, the best seconds of dev/block.jl's fixed
# piece of work (a run's lower quartile); a stage more than 1.5 times AND more than 0.3 s slower than
# its best fails, one past 15% inside that band a note (dev/block.jl SLOWER_FRACTION, SLOWER_TARGET). [best_cpu]: the CPU seconds of the runs that set each best, for the record.
# [best_from]: where each best came from, its records (dev/.block/<tree>-<n>.toml), the commit they
# ran on and their machine factors (A20P20). `WT_TIMING_UPDATE=1 bash dev/gate.sh --block` runs the
# gate three times and lowers each best to the median of the three (raising only a stage the
# commit's own exemption names), writing each best's source. A best is set only so, never by hand:
# one whose source is not an update's median bounds nothing until the update re-records it (A20P25).

[budget]
"case-median" = 1.0
"load" = 20
"probes" = 50
"ratchet" = 30
"smoke-1.13" = 58
"smoke-batch" = 58
"smoke-core" = 58
"tests" = 58
"tests@warm" = 20
"tlc" = 50
"total" = 60

[best]
"calibration" = 0.004047
"load" = 0.24
"load@warm" = 0.17
"probes" = 28.26
"probes@warm" = 0.67
"ratchet" = 9.6
"ratchet@warm" = 6.73
"smoke-core" = 51.79
"smoke-core@warm" = 1.58

[best_cpu]
"load" = 0.51
"load@warm" = 0.22
"probes" = 37.55
"probes@warm" = 1.43
"ratchet" = 12.89
"ratchet@warm" = 8.36
"smoke-core" = 66.83
"smoke-core@warm" = 1.41

[best_from]
"calibration" = "the median of records d683bcbf-1 d683bcbf-2 d683bcbf-3 on cca6cfef at machine factor 1.24 1.25 1.44"
"load" = "one run, record 26a30593-1 on 68a40294 at machine factor 1.54; rescaled by records d683bcbf-1 d683bcbf-2 d683bcbf-3 on cca6cfef at machine factor 1.24 1.25 1.44"
"load@warm" = "the median of records 9da94868-2 9da94868-3 9da94868-4 on 4c618a3d at machine factor 1.41 1.12 1.13"
"probes" = "one run, record 26a30593-1 on 68a40294 at machine factor 1.54; rescaled by records d683bcbf-1 d683bcbf-2 d683bcbf-3 on cca6cfef at machine factor 1.24 1.25 1.44"
"probes@warm" = "the median of records 9da94868-2 9da94868-3 9da94868-4 on 4c618a3d at machine factor 1.41 1.12 1.13"
"ratchet" = "one run, record 26a30593-1 on 68a40294 at machine factor 1.54; rescaled by records d683bcbf-1 d683bcbf-2 d683bcbf-3 on cca6cfef at machine factor 1.24 1.25 1.44"
