# dev/timing_best.toml — the blocking gate's budgets and timing ratchet (dev/block.jl, `bash
# dev/gate.sh --block`; dev/CHARTER.md C10, L194, L195). [budget]: wall seconds, the whole run
# (`total`) and each stage, the core's median smoke case (`case-median`); a budget is lowered, never
# raised (dev/block.jl holds every budget and best to the change's base's): a stage past it is split
# or made faster first; `<stage>@warm` is a stage's budget under
# the warm runner (`--warm`), where it has one. [best]: each ratcheted stage's best wall
# seconds at the machine's best speed, and `calibration`, the best seconds of dev/block.jl's fixed
# piece of work (a run's lower quartile); a stage more than 15% AND more than 0.3 s slower than its
# best fails. [best_cpu]: the CPU seconds of the runs that set each best, for the record.
# [best_from]: where each best came from, its records (dev/.block/<tree>-<n>.toml), the commit they
# ran on and their machine factors (A20P20). `WT_TIMING_UPDATE=1 bash dev/gate.sh --block` runs the
# gate three times and lowers each best to the median of the three (raising only a stage the
# commit's own exemption names), writing each best's source.

[budget]
"case-median" = 1.0
"load" = 20
"probes" = 50
"ratchet" = 30
"smoke-1.13" = 58
"smoke-batch" = 58
"smoke-core" = 58
"tests" = 58
"tests@warm" = 20
"tlc" = 50
"total" = 60

