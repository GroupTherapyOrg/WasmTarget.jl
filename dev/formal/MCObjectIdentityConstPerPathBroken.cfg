\* expect: WriteSeenSameConstant
\* Broken variant: each path to a constant makes a module object of its own: K1 reached by P2 is a copy
\* with its own data array, carrying K1's image id, so no id tells it apart; a write through P1 is not
\* seen through P2, where native Julia's one K1 shows it. DataIdsExact is left out (the copy's dataids
\* equal K1's over two arrays, a second symptom) so the storage claim is the one reached. TLC must
\* report WriteSeenSameConstant violated.
SPECIFICATION Spec
CONSTANTS
    MaxSerial = 3
    RandomIds = FALSE
    MemHeaderIds = FALSE
    LazyConsts = FALSE
    Wraps = FALSE
    ConstByValue = FALSE
    ConstPerPath = TRUE
INVARIANTS
    TypeOK
    AgreesWithEgal
    Unique
    NoWrap
    WriteUnseenDistinctConstants
    WriteSeenSameConstant
CHECK_DEADLOCK TRUE
