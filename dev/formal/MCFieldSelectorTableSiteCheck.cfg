\* The site check (MCFieldSelectorTableSiteCheck.tla's header), which supersedes the row plan's MissingFieldTraps:
\* each selector's row holds only the classes with the field (NoFieldError = TRUE, dart's addMember's targets), and a
\* class without it raises Julia's error at the site, BoundsError for the position-read field b, FieldError for a.
SPECIFICATION Spec
CONSTANTS
    N = 3
    Names = {"a", "b"}
    NoOverlapCheck = FALSE
    NoFieldError = TRUE
    ByPosition = {"b"}
    NoSiteCheck = FALSE
INVARIANTS
    TypeOK
    SiteTypeOK
    SlotUnique
    DispatchExact
    SiteCheckTraps
    SiteReadsExact
    RowsHoldGetters
PROPERTY Ends
CHECK_DEADLOCK TRUE
