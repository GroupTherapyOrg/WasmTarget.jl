\* expect: SetCheckTraps
\* Broken variant: the key's field checked before the class's mutability, so an immutable class without the field
\* raises a read's FieldError or BoundsError where Julia raises its immutable ErrorException. TLC must report
\* SetCheckTraps violated.
SPECIFICATION SetSpec
CONSTANTS
    N = 3
    Names = {"a", "b"}
    NoOverlapCheck = FALSE
    NoFieldError = TRUE
    ByPosition = {"b"}
    NoSiteCheck = FALSE
    NoSetCheck = FALSE
    FieldFirst = TRUE
INVARIANTS
    TypeOK
    SiteTypeOK
    SetTypeOK
    SlotUnique
    DispatchExact
    SetCheckTraps
    SetWritesExact
\* Ends (termination) is MCFieldSelectorTable.cfg's claim: Pack and Finish are its, held and frozen constant
CHECK_DEADLOCK TRUE
