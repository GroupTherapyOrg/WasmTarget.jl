\* expect: NoFabrication
\* Broken instance: FabricateUndefFields = TRUE -- the isdefined(...) ||
\* return nothing / record_unsupported! checks (types.jl:270-271/291,
\* values.jl:1769) are skipped, so an UndefReject occurrence is silently
\* treated as though fully defined. Within the exhaustive N=3 sweep, TLC
\* finds an occurrence with fstat="UndefReject" that, under the bug, never
\* triggers a reject and reaches "Done" -- a NoFabrication violation, claim
\* (3), the claim this flag isolates (the real algorithm's ONLY two outcomes
\* for such a value are "reject the whole compile" or, only for the
\* documented UndefSentinel exception, a fresh construction -- never a
\* silently-accepted fabricated value).
\* A dedicated instance: it checks TypeOK and NoFabrication only. Every state
\* the flag makes wrong violates NoFabrication (an UndefReject occurrence that
\* reaches Done), but an Imm one is also interned, a NoPartialIntern violation
\* (and, beside an egal occurrence, a MutableNeverAliases one), which TLC
\* reports first when those claims are listed before it; no choice of
\* constants avoids it. MCConstants.cfg checks every claim on the real funnel.
CONSTANTS
    N = 3
    EqIds <- MCEqIds
    Types <- MCTypes
    KeyByIsequal = FALSE
    InternMutableKind = FALSE
    SkipChildEagerCheck = FALSE
    FabricateUndefFields = TRUE
    HashOrderNumbering = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoFabrication

CHECK_DEADLOCK TRUE
