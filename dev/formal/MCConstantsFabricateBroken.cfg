\* Broken instance: FabricateUndefFields = TRUE -- the isdefined(...) ||
\* return nothing / record_unsupported! checks (types.jl:270-271/291,
\* values.jl:1769) are skipped, so an UndefReject occurrence is silently
\* treated as though fully defined. Within the exhaustive N=3 sweep, TLC
\* finds an occurrence with fstat="UndefReject" that, under the bug, never
\* triggers a reject and reaches "Done" -- a NoFabrication violation (the
\* real algorithm's ONLY two outcomes for such a value are "reject the whole
\* compile" or, only for the documented UndefSentinel exception, a fresh
\* construction -- never a silently-accepted fabricated value).
CONSTANTS
    N = 3
    EqIds <- MCEqIds
    InternMutableKind = FALSE
    SkipChildEagerCheck = FALSE
    FabricateUndefFields = TRUE
    HashOrderNumbering = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Canonicalization
    MutableNeverAliases
    NoPartialIntern
    NoFabrication
    DeterministicNumbering

PROPERTIES
    RejectHalts

CHECK_DEADLOCK TRUE
