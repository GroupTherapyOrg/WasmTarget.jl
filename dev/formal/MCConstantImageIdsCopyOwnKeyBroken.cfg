\* expect: AgreesWithEgal
\* Broken variant: a live copy's key names the copy itself, not the original Memory O3 it stands for
\* (the key ConstantOwner kept before step 3 for an Array shorter than its Memory or a Dict's vals with
\* a deleted slot): its image id is the copy's own, while objectid of O3, folded at compile time or
\* computed natively, is O3's. TLC must report AgreesWithEgal violated.
SPECIFICATION Spec
CONSTANTS
    MaxSerial = 2
    CopyOwnKey = TRUE
    NoCollisionCheck = FALSE
INVARIANTS
    TypeOK
    Unique
    AgreesWithEgal
CHECK_DEADLOCK TRUE
