\* Correct instance: all four bug flags off. Exhaustive over N=3 occurrences,
\* 2 structural-equality classes (2*3*childchoices*2 per-index combinations;
\* ~10k initial states, a few seconds with default workers).
CONSTANTS
    N = 3
    EqIds <- MCEqIds
    InternMutableKind = FALSE
    SkipChildEagerCheck = FALSE
    FabricateUndefFields = FALSE
    HashOrderNumbering = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Canonicalization
    MutableNeverAliases
    NoPartialIntern
    NoFabrication
    DeterministicNumbering

PROPERTIES
    RejectHalts

CHECK_DEADLOCK TRUE
