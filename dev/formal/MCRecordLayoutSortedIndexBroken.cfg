\* expect: IndexIsPlace
\* Broken variant: a name's index is its place among the sorted names, dart's, where a Julia
\* NamedTuple lays its fields out in declared order: (b = 1, a = 2) reads b from a's field. TLC must
\* report IndexIsPlace violated.
SPECIFICATION Spec
CONSTANTS
    SortedIndex = TRUE
    NamesOnly = FALSE
    OpenAsEmpty = FALSE
INVARIANTS
    TypeOK
    IndexIsPlace
    EqualIsLayout
    OpenRejects
CHECK_DEADLOCK TRUE
