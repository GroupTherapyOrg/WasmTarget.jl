\* expect: SetCheckTraps
\* Broken variant: no class-id check before the setter selector's call, so a write Julia refuses reaches the
\* selector, whose row holds only the classes taking the write: another selector's slot, a null slot or a static
\* call of another class's setter, never Julia's error. TLC must report SetCheckTraps violated.
SPECIFICATION SetSpec
CONSTANTS
    N = 3
    Names = {"a", "b"}
    NoOverlapCheck = FALSE
    NoFieldError = TRUE
    ByPosition = {"b"}
    NoSiteCheck = FALSE
    NoSetCheck = TRUE
    FieldFirst = FALSE
INVARIANTS
    TypeOK
    SiteTypeOK
    SetTypeOK
    SlotUnique
    DispatchExact
    SetCheckTraps
    SetWritesExact
\* Ends (termination) is MCFieldSelectorTable.cfg's claim: Pack and Finish are its, held and frozen constant
CHECK_DEADLOCK TRUE
