\* Broken instance: ClassifyAfterEmit = TRUE -- the pre-Phase-6.2 ordering.
\* ClassifiesFirst(t) becomes FALSE for every non-normal statement regardless
\* of its own ClassifyAtBoundary value, so RecordDiagnostic is never enabled
\* for s2..s5 and EmitUnsupportedBypassed is their only transition out of
\* Lowering, landing in InternalError with no WasmDiagnostic ever recorded.
\* TLC must report a violation (InternalNeverTerminal).
CONSTANTS
    Stmts <- StmtsDef
    Kind <- KindDef
    CallerHint <- CallerHintDef
    ProvenDead <- ProvenDeadDef
    ClassifyAtBoundary <- ClassifyAtBoundaryDef
    AllowTrapWithoutProof = FALSE
    ClassifyAfterEmit = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoSilentValue
    TrapNeedsProof
    InternalNeverTerminal
    LedgerComplete

PROPERTIES
    NoStuckUnsupported
