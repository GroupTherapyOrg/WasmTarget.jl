\* expect: Covered
\* Broken instance: the record keys a captor's box read through `#self#`, an SSA value or an
\* argument but not a constant, so a closure held in a constant global writes a Float64 through
\* the constant (its inlined call), which joins nothing, while a read of the same closure type
\* through an argument takes the world's Int64 join (see CaptureType.tla, "Which operand carries
\* a captor").
SPECIFICATION Spec
CONSTANTS
    BodyLocalGuess = FALSE
    PerFieldRecord = FALSE
    NestedJoined = TRUE
    Keyed <- MCKeyedNoConstant
INVARIANT Covered
