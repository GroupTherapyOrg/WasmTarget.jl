\* expect: LeavesNeverCollected
\* LateLeafUncut (checks MCClosedWorldLeaves.tla): only the first collection is cut
\* (LateCut = FALSE), the code before batch 111 once the superseded trim, which cut a late
\* round's import body as a side effect, is gone. The round order: the first collection
\* infers I1 and Q1 and cuts them; the dynamic step enrolls B one round later; that
\* round's compile! of B infers the import I2's native body (and Q2), and the merge takes
\* them uncut, so the plan holds an import's native body in the import's place.
SPECIFICATION Spec
CONSTANTS
    Methods <- MCMethods
    Roots <- MCRoots
    Types <- MCTypes
    InvokeEdges <- MCInvokeEdges
    Retargets <- MCRetargets
    TypeSites <- MCTypeSites
    DynSites <- MCDynSites
    DynTargets <- MCDynTargets
    SpecializeFails <- MCSpecializeFails
    RoundCeiling <- MCRoundCeiling
    SwallowFailures <- MCSwallowFailures
    HiddenEdges <- MCHiddenEdges
    Unmaterialized <- MCUnmaterialized
    Widened <- MCWidened
    CollectorKinds <- MCCollectorKinds
    Trim <- MCTrim
    FmaEdges <- MCFmaEdges
    ExternalLeaves <- MCExternalLeaves
    LateCut = FALSE
    RootsOnlyIfNew = FALSE
INVARIANT TypeOK
INVARIANT LeavesNeverCollected
INVARIANT NoGarbage
INVARIANT Completeness
INVARIANT NoOptOut
INVARIANT FailureIsLoud
INVARIANT Idempotence
