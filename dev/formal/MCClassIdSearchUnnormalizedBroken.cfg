\* expect: Routes
\* Broken variant: a caller skips normalize, so its ranges may be unsorted or overlapping (every list of up to N = 2
\* ranges: the linear form, which checks no order; the binary form's leaf guard rejects such a list at compile time).
\* An id two overlapping ranges share takes the first range's arm though it lies in the second. TLC must report
\* Routes violated.
SPECIFICATION Spec
CONSTANTS
    W = 4
    IdMax = 6
    N = 2
    ElideWithMiss = FALSE
    SplitOffByOne = FALSE
    SignedLinear = FALSE
    Unnormalized = TRUE
INVARIANT Routes
