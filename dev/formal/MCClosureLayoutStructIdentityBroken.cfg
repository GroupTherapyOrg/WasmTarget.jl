\* expect: ContextsToldApart
\* Broken instance: TellApartByStruct=TRUE -- a context's class read from its struct type, the
\* claim that distinct closure types have distinct context structs. t2 and t3 capture alike, so
\* add_type! gives them one struct type and the two classes read as one; the classId field tells
\* them apart.
SPECIFICATION Spec
CONSTANTS
    Types <- MCTypes
    Arities <- MCArities
    FieldClasses <- MCFieldClasses
    FieldStorage <- MCFieldStorage
    OwnStorage <- MCOwnStorage
    DeclaredFields <- MCDeclaredFields
    DeclaredArity <- MCDeclaredArity
    MaxArrivals = 2
    TellApartByStruct = TRUE
    HashOrderCapture = FALSE
    AllowArityDrift = FALSE
    OwnFieldRule = FALSE

INVARIANTS
    TypeOK
    CapturedFieldsAreDeclaredOrder
    OneFieldTranslation
    SharedOnlyIfAlike
    ContextsToldApart
    NoGlobalIdCollision
    OneVtableStructPerArity
    WellFormedVtable

CHECK_DEADLOCK TRUE
