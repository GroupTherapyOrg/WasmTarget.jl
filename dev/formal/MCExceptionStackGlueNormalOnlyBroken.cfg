\* expect: Agrees
\* The count lowered only on a normal return, as wasm code that counts its own calls lowers it:
\* an import that overflows the JS stack strands the count its call raised, so the next top-level
\* call is taken as re-entrant, is not reset, and reads the previous call's top (A13E1's
\* import variant, measured natively 2 and in wasm 1).
\* Against the design (every flag as in MCExceptionStack.cfg); one flag flips.
SPECIFICATION Spec
CONSTANTS
    Vals = {"a", "b"}
    MaxFrames = 3
    MaxSteps = 15
    MaxCalls = 2
    Impl = "cells"
    RethrowChecksDepth = TRUE
    PushAtLanding = FALSE
    KeepsEntry = FALSE
    ResetAtEntry = FALSE
    Landing = "identity"
    TopLevelReset = TRUE
    GlueFinally = FALSE
    ReturnRestores = TRUE
    EntryTakesSlot = TRUE
    HasImport = TRUE
    ImportThrows = TRUE
    HostCatchesTrap = TRUE
    PropagatesTrap = TRUE
    ImportExhausts = TRUE
    ExhaustReentrant = TRUE
    ReraiseShared = FALSE
    HostCallsGlued = FALSE
INVARIANT TypeOK
INVARIANT Agrees
