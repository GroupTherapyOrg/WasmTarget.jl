\* expect: DeterministicNumbering
\* Broken variant: a global numbered by its constant's hash bucket (HashSeq) where _nextGlobalId
\* numbers it in definition order (the L112 class: numbering by a Dict's walk), so the numbers are
\* neither 1..n nor in the program's order of use. TLC must report DeterministicNumbering violated;
\* it is listed before ChildrenFirst, which a hash order can break only in a state that breaks it too.
SPECIFICATION Spec
CONSTANTS
    KeyIsequal = FALSE
    ParentFirst = FALSE
    IgnoreChildLaziness = FALSE
    OwnType = FALSE
    NoCycleCheck = FALSE
    Fabricate = FALSE
    HashOrder = TRUE
    ReverseUses = FALSE
INVARIANTS
    TypeOK
    DeterministicNumbering
    SharesOnlyEgal
    ChildrenFirst
    EagerChildrenEager
    OperandsTyped
    CyclesReject
    NoFabrication
CHECK_DEADLOCK TRUE
