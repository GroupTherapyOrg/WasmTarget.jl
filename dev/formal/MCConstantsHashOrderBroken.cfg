\* expect: DeterministicNumbering
\* Broken variant: a global numbered by its constant's hash bucket (HashSeq) where _nextGlobalId
\* numbers it by definition order (the L112 class: numbering by a Dict's walk). TLC must report
\* DeterministicNumbering violated; it is listed before ChildrenFirst, which a hash order can break
\* only in a state that breaks it too.
SPECIFICATION Spec
CONSTANTS
    KeyIsequal = FALSE
    ParentFirst = FALSE
    IgnoreChildLaziness = FALSE
    OwnType = FALSE
    NoCycleCheck = FALSE
    Fabricate = FALSE
    HashOrder = TRUE
INVARIANTS
    TypeOK
    DeterministicNumbering
    SharesOnlyEgal
    ChildrenFirst
    EagerChildrenEager
    OperandsTyped
    CyclesReject
    NoFabrication
CHECK_DEADLOCK TRUE
