\* expect: ValuesCovered
\* Broken variant: Type{X} brings its kind alone, not the classes X denotes, so a type value's layout
\* names a classId the list never numbered. TLC must report ValuesCovered violated.
SPECIFICATION Spec
CONSTANTS
    NoSeenGuard = FALSE
    KindOnly = TRUE
    NoSupertype = FALSE
    NoFields = FALSE
    KindsAlways = FALSE
    NoContents = FALSE
INVARIANTS
    TypeOK
    Once
    ValuesCovered
    SupertypeClosed
    FieldsClosed
    NothingExtra
PROPERTY Terminates
CHECK_DEADLOCK TRUE
