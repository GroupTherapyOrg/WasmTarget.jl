    MaxOps = 3
    DefaultRead = FALSE
    NoMemo = TRUE
    CycleReruns = FALSE
    ThrowSticks = FALSE
    Overwrite = FALSE
INVARIANTS
    TypeOK
    Stable
    InitAtMostOnce
    OneInitAtATime
    NoDefaultRead
    ReadsAgree
    RejectsOnlyMisuse
PROPERTY Ends
CHECK_DEADLOCK TRUE
