\* expect: OneInitAtATime
\* Broken variant: a read from inside init runs init again instead of rejecting the cycle, a recursion
\* with no end. TLC must report OneInitAtATime violated.
SPECIFICATION Spec
CONSTANTS
    MaxOps = 3
    DefaultRead = FALSE
    NoMemo = FALSE
    CycleReruns = TRUE
    ThrowSticks = FALSE
    Overwrite = FALSE
INVARIANTS
    TypeOK
    Stable
    InitAtMostOnce
    OneInitAtATime
    NoDefaultRead
    ReadsAgree
    RejectsOnlyMisuse
PROPERTY Ends
CHECK_DEADLOCK TRUE
