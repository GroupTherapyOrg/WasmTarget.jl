    IgnoreNullability     = FALSE
    CastTuple             = FALSE
    TrustStatedSource     = FALSE
    CastNothing           = FALSE
    NothingNullOnlyConcrete = FALSE
    UnboxNothing = TRUE
    NothingPlaceholder = FALSE

INVARIANT TypeOK
INVARIANT Total
INVARIANT NoRedundantCast
INVARIANT RejectsOnlyInexpressible
INVARIANT NoTupleCast
INVARIANT NoUnclassedWidening
INVARIANT NothingIsNull
INVARIANT NothingNeverCast
