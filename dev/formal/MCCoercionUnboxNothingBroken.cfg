\* expect: NothingNeverCast
\* A nothing held in a reference (its null) bound for a non-null reference is made non-null as a
\* value: ref.as_non_null of the null traps (a closure entry narrowing an erased nothing, smoke
\* closure_union_nothing_erased).
SPECIFICATION Spec

