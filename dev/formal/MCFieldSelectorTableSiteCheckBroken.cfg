\* expect: SiteCheckTraps
\* Broken variant: no class-id check before the selector's call, so a receiver of a class without the field reaches
\* the selector, whose row holds only the classes with it: another selector's slot, a null slot or a static call of
\* another class's getter, never Julia's error. TLC must report SiteCheckTraps violated.
SPECIFICATION Spec
CONSTANTS
    N = 3
    Names = {"a", "b"}
    NoOverlapCheck = FALSE
    NoFieldError = TRUE
    ByPosition = {"b"}
    NoSiteCheck = TRUE
INVARIANTS
    TypeOK
    SiteTypeOK
    SlotUnique
    DispatchExact
    SiteCheckTraps
    SiteReadsExact
    RowsHoldGetters
PROPERTY Ends
CHECK_DEADLOCK TRUE
