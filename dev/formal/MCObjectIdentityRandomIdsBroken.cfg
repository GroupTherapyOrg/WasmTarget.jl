\* can hold one id, which Base's HAMT refuses (julia/base/hamt.jl:205 "Perfect hash collision") where
\* native Julia, inthash of distinct addresses, never collides. TLC must report Unique violated. NoWrap,
\* a claim about the counter, is not checked: a draw keeps no counter.
