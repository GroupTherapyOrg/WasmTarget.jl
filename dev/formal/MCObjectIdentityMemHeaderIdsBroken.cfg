\* expect: DataIdsExact
\* Broken variant: dataids of a Memory reads the Memory's own slot, not its data owner's: two Memories
\* wrapping one String's bytes (jl_string_to_genericmemory, julia/src/genericmemory.c:104-113) share
\* their data but answer different ids, so mightalias answers false where native Julia, reading the
\* one data address, answers true. TLC must report DataIdsExact violated.
SPECIFICATION Spec
CONSTANTS
    MaxSerial = 3
    RandomIds = FALSE
    MemHeaderIds = TRUE
    LazyConsts = FALSE
    Wraps = FALSE
    ConstByValue = FALSE
    ConstPerPath = FALSE
INVARIANTS
    TypeOK
    WriteSeenSameConstant
    WriteUnseenDistinctConstants
    ConstantDataAgrees
    AgreesWithEgal
    Unique
    NoWrap
    DataIdsExact
CHECK_DEADLOCK TRUE
