\* Broken instance: SkipCrossingNormalization = TRUE -- the pre-L90
\* behavior. Duplication never applies (no target is ever removed from the
\* labeling machinery), AND the LIFO innermost assertion at every close is
\* skipped: a close removes whatever symbolic entry it finds, at ANY
\* position, while the ground-truth physical stack still only ever pops
\* its true top. On the FIXED crossing-region witness CFG in
\* MCStackifier.tla's header (N=6; exhaustive enumeration at this size is
\* not CI-tractable, see MCStackifier.cfg) this desyncs labelstack from
\* physstack, and the algorithm goes on to emit a branch that its own
\* (now-wrong) bookkeeping believes is open when physstack proves it is
\* not. TLC must report a WellScopedBr violation.
CONSTANTS
    N = 6
    SkipCrossingNormalization = TRUE
    UseSpanCarving = FALSE

SPECIFICATION WitnessSpec

INVARIANTS
    TypeOK
    WellScopedBr
    Balanced
    EveryEdgeRealized

PROPERTIES
    RejectNeverEmits

CHECK_DEADLOCK TRUE
