\* expect: Deadlock
\* Broken variant: a taker reads the marks, then flocks, and never reads them again (the review's F2): between its read
\* and its flock a measurement pauses (its claim written, its role kept, the lock let go); the taker takes the lock and
\* waits on that role, the paused one waits on the lock.
SPECIFICATION Spec
CONSTANTS
    Rounds = 2
    Kinds = {"LAND", "REB", "LAYER"}
    Slots = {"M1", "M2"}
    MaxDeaths = 0
    MaxReuse = 0
    RealTiming = TRUE
    FixYield = TRUE
    FixNonStops = TRUE
    Recheck = FALSE
    VerifyStop = TRUE
    StartIdentity = TRUE
    LayerStops = TRUE
    ReapUnheld = TRUE
INVARIANTS
    TypeOK
    NoCheckBesideRunning
    OneRoleHolder
CHECK_DEADLOCK TRUE
