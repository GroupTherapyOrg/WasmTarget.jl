\* expect: FailureIsLoud
\* SwallowFailures = TRUE: a try/catch drops the failing candidate D instead of
\* letting the throw abort the plan, and Done is reached with D missing. It
\* breaks ClosedWorld.tla's claim (4), FailureIsLoud. A dedicated instance: it
\* checks TypeOK and FailureIsLoud only. A swallowed candidate is never
\* collected, so every state that violates FailureIsLoud violates Completeness
\* (and NoOptOut, its alias) too, which TLC reports first when listed before
\* it; no choice of constants avoids that. MCClosedWorld.cfg checks every
\* claim on the real loop.
SPECIFICATION Spec
CONSTANTS
    Methods <- MCMethods
    Roots <- MCRoots
    Types <- MCTypes
    InvokeEdges <- MCInvokeEdges
    Retargets <- MCRetargets
    TypeSites <- MCTypeSites
    DynSites <- MCDynSites
    DynTargets <- MCDynTargets
    SpecializeFails <- MCSpecializeFails
    RoundCeiling <- MCRoundCeiling
    SwallowFailures <- MCSwallowFailures
    HiddenEdges <- MCHiddenEdges
    Unmaterialized <- MCUnmaterialized
    Widened <- MCWidened
    CollectorKinds <- MCCollectorKinds
    Trim <- MCTrim
    FmaEdges <- MCFmaEdges
    ExternalLeaves <- MCExternalLeaves
    LateCut <- MCLateCut
    RootsOnlyIfNew = FALSE
INVARIANT TypeOK
INVARIANT FailureIsLoud
