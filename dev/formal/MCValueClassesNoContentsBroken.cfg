\* expect: ValuesCovered
\* Broken variant: a constant brings its own class, not the values it holds, so a Float held in a
\* Box's field declared Any has a class the list never numbered. TLC must report ValuesCovered violated.
SPECIFICATION Spec
CONSTANTS
    NoSeenGuard = FALSE
    KindOnly = FALSE
    NoSupertype = FALSE
    NoFields = FALSE
    KindsAlways = FALSE
    NoContents = TRUE
INVARIANTS
    TypeOK
    Once
    ValuesCovered
    SupertypeClosed
    FieldsClosed
    NothingExtra
PROPERTY Terminates
CHECK_DEADLOCK TRUE
