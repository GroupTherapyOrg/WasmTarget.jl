\* Correct instance: L90 (duplication + the LIFO close checks) and the
\* reachability-based dead-code mechanism (b9f4d229) both fully active.
\* All five claims must hold, EXHAUSTIVELY, across every CFG in the N=4
\* class (4368 initial states / 25808 total; ~8s with 10 workers after
\* caching the two fixpoints -- see the PERFORMANCE note above
\* AlgoDeadBlocks in Stackifier.tla). N=5 exhaustive was tried and is NOT
\* CI-tractable (>32768 initial states still not exhausted after 46
\* minutes, unrelated to this cfg's own correctness): the two Broken
\* instances below use a fixed WITNESS CFG instead of exhaustive N=5/6
\* enumeration for exactly that reason -- both crossing-region shapes this
\* model can express need >= 5 blocks (see their headers), so N=4 alone
\* cannot exercise them, but N=4 remains a genuine exhaustive proof for
\* every shape it DOES contain.
