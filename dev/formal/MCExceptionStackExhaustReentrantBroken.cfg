\* expect: Agrees
\* dev/MARCH.md 13.17 A13E1 (open finding, the residual of A12B1): stack exhaustion inside a
\* re-entrant call. Its RangeError is uncatchable by wasm, as a trap: the callee's entry restores
\* nothing. When the host catches the exhaustion, the callee's entries stay on WT's stack for the
\* rest of the outer call, where Julia's host restores the callee's entry depth; when the host lets
\* it propagate through the import, the import's decrement never runs and the count stays raised.
\* Unlike a trap the host keeps the instance, so this is a run the host makes. TLC's
\* counterexample is the second: HostCall, Enter, Rethrow (Julia's ErrorException lands),
\* ImportCall, HostCall (re-entrant), Abort("exhaust"), HostPropagate (out of the outer call too),
\* HostCall (count 1: not reset), Read (WT reads the ErrorException, Julia `nothing`).
\* Against the design (every flag as in MCExceptionStack.cfg, an import that throws); one flag flips.
