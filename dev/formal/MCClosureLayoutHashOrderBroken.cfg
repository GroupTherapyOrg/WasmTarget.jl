\* Broken instance: HashOrderCapture=TRUE -- register_closure_type! builds a
\* newly-seen closure type's field list from an unordered/hash-keyed walk
\* instead of the real `1:fieldcount(T)` index range. t1 declares TWO
\* distinct-class fields, so Perms(2) gives TLC a genuinely wrong ordering
\* (<<"Ref","Num">> instead of <<"Num","Ref">>) to pick, violating
\* CapturedFieldsAreDeclaredOrder with no reject in between.
SPECIFICATION Spec
CONSTANTS
    Types <- MCTypes
    Arities <- MCArities
    FieldClasses <- MCFieldClasses
    DeclaredFields <- MCDeclaredFields
    DeclaredArity <- MCDeclaredArity
    MaxArrivals = 2
    HashOrderCapture = TRUE
    AllowArityDrift = FALSE

INVARIANTS
    TypeOK
    CapturedFieldsAreDeclaredOrder
    NoStructIdCollision
    NoGlobalIdCollision
    OneVtableStructPerArity
    WellFormedVtable

CHECK_DEADLOCK TRUE
