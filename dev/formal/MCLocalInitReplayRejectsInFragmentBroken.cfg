\* expect: MergeAgrees
\* WT nests builder fragments: an append into a FRAGMENT must re-record an unmet requirement as that
\* fragment's own; rejecting at that append (only the top builder may reject) rejects the valid
\* `set n; [G: [F: get n]]` when F is appended into G.
SPECIFICATION Spec
CONSTANTS
    MaxLen = 5
    MaxFrags = 2
    NoResetAtEnd = FALSE
    MergeIgnoresRequires = FALSE
    MergeAppliesNestedSets = FALSE
    ReplayRejectsInFragment = TRUE
INVARIANT TypeOK
INVARIANT Agrees
INVARIANT MergeAgrees
