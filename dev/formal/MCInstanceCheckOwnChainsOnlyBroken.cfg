\* expect: CheckIsJuliaIsa
\* Broken variant: the numbering holds the world's classes and their chains, not the classes their
\* fields name. The Tuple arm checks an element type through the class table, so Tuple{Int,Int}
\* isa Tuple{Real,Real} finds Int unnumbered where no Int is otherwise in the world, and answers
\* false where Julia answers true. TLC must report CheckIsJuliaIsa violated.
SPECIFICATION Spec
CONSTANTS
    NoTupleArm = FALSE
    NoTypeArm = FALSE
    OwnChainsOnly = TRUE
INVARIANTS
    TypeOK
    CheckIsJuliaIsa
CHECK_DEADLOCK FALSE
