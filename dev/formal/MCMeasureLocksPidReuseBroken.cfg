\* expect: DeadMarksHoldNobody
\* Broken variant: a mark names its writer by pid and boot alone, and only its writer removes it (the review's F5): the
\* writer dies, its pid is reused, and its mark reads live again, holding every taker back.
SPECIFICATION Spec
CONSTANTS
    Rounds = 2
    Kinds = {"LAND", "REB", "LAYER"}
    Slots = {"M1", "M2"}
    MaxDeaths = 1
    MaxReuse = 1
    RealTiming = TRUE
    FixYield = TRUE
    FixNonStops = TRUE
    Recheck = TRUE
    VerifyStop = TRUE
    StartIdentity = FALSE
    LayerStops = TRUE
    ReapUnheld = TRUE
INVARIANTS
    TypeOK
    NoCheckBesideRunning
    OneRoleHolder
    DeadMarksHoldNobody
CHECK_DEADLOCK TRUE
