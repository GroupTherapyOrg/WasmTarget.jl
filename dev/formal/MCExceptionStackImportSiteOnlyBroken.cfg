\* expect: Agrees
\* A catch_all_ref at every host-import call site (decrement, rethrow) instead of at the entry,
\* whose handler catches only the tag: a re-entrant foreign escape the host catches (the engine's
\* RangeError) passes the callee's entry and leaves its entries for the rest of the outer call.
\* Against the design (every flag as in MCExceptionStack.cfg, an import that throws); two flags flip.
SPECIFICATION Spec
CONSTANTS
    Vals = {"a", "b"}
    MaxFrames = 3
    MaxSteps = 15
    MaxCalls = 2
    Impl = "cells"
    RethrowChecksDepth = TRUE
    PushAtLanding = FALSE
    KeepsEntry = FALSE
    ResetAtEntry = FALSE
    Landing = "identity"
    TopLevelReset = TRUE
    LandingRestoresCount = TRUE
    EntryRestoresCount = TRUE
    EntryCatchesAll = FALSE
    ImportSiteCatch = TRUE
    HasImport = TRUE
    ImportThrows = TRUE
    HostCatchesTrap = FALSE
    PropagatesTrap = FALSE
INVARIANT TypeOK
INVARIANT Agrees
