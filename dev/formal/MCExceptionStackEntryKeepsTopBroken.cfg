\* expect: Agrees
\* A re-entrant entry keeps the top it finds: inside one import the host catches a re-entrant
\* escape and calls again, and the second call reads the first one's exception.
\* Against the design (every flag as in MCExceptionStack.cfg); one flag flips.
SPECIFICATION Spec
CONSTANTS
    Vals = {"a", "b"}
    MaxFrames = 3
    MaxSteps = 15
    MaxCalls = 2
    Impl = "cells"
    RethrowChecksDepth = TRUE
    PushAtLanding = FALSE
    KeepsEntry = FALSE
    ResetAtEntry = FALSE
    Landing = "identity"
    TopLevelReset = TRUE
    GlueFinally = TRUE
    ReturnRestores = TRUE
    EntryTakesSlot = FALSE
    HasImport = TRUE
    ImportThrows = TRUE
    HostCatchesTrap = TRUE
    PropagatesTrap = TRUE
    ImportExhausts = TRUE
    ExhaustReentrant = TRUE
    ReraiseShared = FALSE
    HostCallsGlued = FALSE
INVARIANT TypeOK
INVARIANT Agrees
