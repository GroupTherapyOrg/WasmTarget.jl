\* expect: MissingFieldTraps
\* Broken variant: only classes with the field get a target, as dart's addMember gives, so a receiver
\* without the field reaches another selector's slot, a null slot or a static call of another class's
\* getter, never Julia's FieldError. TLC must report MissingFieldTraps violated.
SPECIFICATION Spec
CONSTANTS
    N = 3
    Names = {"a", "b"}
    NoOverlapCheck = FALSE
    NoFieldError = TRUE
INVARIANTS
    TypeOK
    SlotUnique
    DispatchExact
    MissingFieldTraps
PROPERTY Ends
CHECK_DEADLOCK TRUE
