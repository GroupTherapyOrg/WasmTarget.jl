\* expect: ReadsTruth
\* Broken variant: the setter stores the value but leaves the flag unset, so a later read runs the
\* initializer over the write and returns the image value. TLC must report ReadsTruth violated.
SPECIFICATION Spec
CONSTANTS
    MaxOps = 4
    ReadBeforeFlag = FALSE
    SetterNoFlag = TRUE
INVARIANTS
    TypeOK
    ReadsTruth
    NoPlaceholderRead
    InitAtMostOnce
PROPERTY Ends
CHECK_DEADLOCK TRUE
