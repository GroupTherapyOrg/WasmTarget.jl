\* The design: the glue owns the count, a call of a host-declared import stores the top at index
\* count and restores it after a normal return, every entry a prologue. Every kind of escape, two
\* calls deep: an import that throws or overflows the JS stack, stack exhaustion in a re-entrant
\* call, a re-entrant trap the host catches or propagates, a caught escape the host re-raises; MaxSteps 16, the
\* length of ValueIdentity's counterexample.
SPECIFICATION Spec
CONSTANTS
    Vals = {"a", "b"}
    MaxFrames = 3
    MaxSteps = 16
    MaxCalls = 2
    Impl = "cells"
    RethrowChecksDepth = TRUE
    PushAtLanding = FALSE
    KeepsEntry = FALSE
    ResetAtEntry = FALSE
    Landing = "identity"
    TopLevelReset = TRUE
    GlueFinally = TRUE
    ReturnRestores = TRUE
    EntryTakesSlot = TRUE
    HasImport = TRUE
    ImportThrows = TRUE
    HostCatchesTrap = TRUE
    PropagatesTrap = TRUE
    ImportExhausts = TRUE
    ExhaustReentrant = TRUE
    ReraiseShared = FALSE
    HostCallsGlued = FALSE
INVARIANT TypeOK
INVARIANT Agrees
