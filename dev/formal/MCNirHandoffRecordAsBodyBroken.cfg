\* expect: RejectsOnlyGaps
\* Broken variant: a queued ccallable's record, svec(rettype, signature), is left among the
\* CodeInstance and CodeInfo pairs, which then misalign, and a sound world rejects Internal. TLC must
\* report RejectsOnlyGaps violated.
SPECIFICATION Spec
CONSTANTS
    AbstractRecord = FALSE
    QueueAll = FALSE
    NoDedup = FALSE
    UnreadRepeat = FALSE
    SkipOdd = FALSE
    RecordAsBody = TRUE
    KeepIntrinsic = FALSE
INVARIANTS
    TypeOK
    CcallablesJudged
    QueuedReached
    OneBodyPerCI
    Complete
    RepeatAsserted
    Aligned
    RejectsOnlyGaps
PROPERTY Terminates
CHECK_DEADLOCK TRUE
