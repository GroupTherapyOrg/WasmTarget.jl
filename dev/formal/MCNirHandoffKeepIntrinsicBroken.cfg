\* expect: Complete
\* Broken variant: the body of a member the intrinsifier lowers at its call collected, Julia's native
\* evaluation of it built as the program's. TLC must report Complete violated.
SPECIFICATION Spec
CONSTANTS
    AbstractRecord = FALSE
    QueueAll = FALSE
    NoDedup = FALSE
    UnreadRepeat = FALSE
    SkipOdd = FALSE
    RecordAsBody = FALSE
    KeepIntrinsic = TRUE
INVARIANTS
    TypeOK
    CcallablesJudged
    QueuedReached
    OneBodyPerCI
    Complete
    RepeatAsserted
    Aligned
    RejectsOnlyGaps
PROPERTY Terminates
CHECK_DEADLOCK TRUE
