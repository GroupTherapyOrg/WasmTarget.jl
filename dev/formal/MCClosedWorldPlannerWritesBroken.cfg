\* expect: ReasonsComplete
\* The collector records a reason only for the bodies it enrolls; A, which Julia's queue collected
\* with the entry, has none until the planner walks the edges again and writes it (A2C4).
SPECIFICATION Spec
CONSTANTS
    Methods <- MCMethods
    Roots <- MCRoots
    Types <- MCTypes
    InvokeEdges <- MCInvokeEdges
    Retargets <- MCRetargets
    TypeSites <- MCTypeSites
    DynSites <- MCDynSites
    DynTargets <- MCDynTargets
    SpecializeFails <- MCSpecializeFails
    RoundCeiling <- MCRoundCeiling
    SwallowFailures <- MCSwallowFailures
    HiddenEdges <- MCHiddenEdges
    Unmaterialized <- MCUnmaterialized
    Widened <- MCWidened
    CollectorKinds <- MCCollectorKinds
    Trim <- MCTrim
    FmaEdges <- MCFmaEdges
    ExternalLeaves <- MCExternalLeaves
    LateCut <- MCLateCut
    RootsOnlyIfNew = FALSE
    WorldSites <- MCWorldSites
    WorldSitesDropped = FALSE
    PlannerWrites = TRUE
INVARIANT TypeOK
INVARIANT RootsComplete
INVARIANT ReasonsComplete
INVARIANT Completeness
INVARIANT NoOptOut
INVARIANT FailureIsLoud
INVARIANT Idempotence
INVARIANT StepsBounded
PROPERTY Terminates
PROPERTY EndsDone
