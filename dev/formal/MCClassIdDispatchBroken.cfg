\* Broken variant: lazily numbered classes take max(type_ids)+1 in registry (Dict)
\* iteration order instead of a sort key. TLC must report Determinism violated:
\* two late classes touched in the other order swap their classIds.
SPECIFICATION Spec
CONSTANTS
    N = 6
    MaxLate = 2
    UnsortedIteration = TRUE
    NoCascadeReject = FALSE
    NoSpanGuard = FALSE
    ExtrasNeedRange = FALSE
    Selectors <- MCSelectors
    Arity <- MCArity
    MethodSpace <- MCMethodSpace
INVARIANTS
    TypeOK
    Determinism
CHECK_DEADLOCK FALSE
