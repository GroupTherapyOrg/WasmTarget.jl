\* expect: Agrees
\* Broken variant: each left value's remainder entry precedes its exact one, so the value itself finds
\* the remainder and answers false. TLC must report Agrees violated.
SPECIFICATION Spec
CONSTANTS
    Vals <- MCVals
    Eq <- MCEq
    Left <- MCLeft
    Right = {}
    Wide = TRUE
    RestFirst = TRUE
    NoPremise = FALSE
INVARIANTS
    TypeOK
    Total
    Agrees
CHECK_DEADLOCK TRUE
