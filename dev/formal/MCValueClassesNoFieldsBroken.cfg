\* expect: FieldsClosed
\* Broken variant: a concrete class brings no field types, so a value read from a field has a class
\* the list never numbered. TLC must report FieldsClosed violated.
SPECIFICATION Spec
CONSTANTS
    NoSeenGuard = FALSE
    KindOnly = FALSE
    NoSupertype = FALSE
    NoFields = TRUE
    KindsAlways = FALSE
    NoContents = FALSE
INVARIANTS
    TypeOK
    Once
    ValuesCovered
    SupertypeClosed
    FieldsClosed
    NothingExtra
PROPERTY Terminates
CHECK_DEADLOCK TRUE
