\* expect: SharedOnlyIfEgal
\* Broken instance: KeyByIsequal = TRUE -- the map is keyed by `isequal`/`hash` (a
\* `Dict{Any}`), so two constants of different types that are `isequal` -- `(0x01,)` and
\* `(1,)`, `1` and `1.0` -- share the first one's global. TLC finds a "Done" state where two
\* occurrences that are not egal share a global: a SharedOnlyIfEgal violation (Random's
\* hash_seed read the `Tuple{Int64}` global at its `Tuple{UInt8}` site and trapped).
CONSTANTS
    N = 3
    EqIds <- MCEqIds
    Types <- MCTypes
    KeyByIsequal = TRUE
    InternMutableKind = FALSE
    SkipChildEagerCheck = FALSE
    FabricateUndefFields = FALSE
    HashOrderNumbering = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Canonicalization
    SharedOnlyIfEgal
    MutableNeverAliases
    NoPartialIntern
    NoFabrication
    DeterministicNumbering

PROPERTIES
    RejectHalts

CHECK_DEADLOCK TRUE
