\* expect: Agrees
\* dev/MARCH.md 13.17 A13E1 (open finding, the residual of A12B1): stack exhaustion inside a
\* host-declared import. An import that overflows the JS stack raises a RangeError wasm cannot
\* catch, as a trap: no landing, the entry's catch_all_ref does not run, and the import's
\* decrement never runs. Unlike a trap the host keeps the instance, so this is a run the host
\* makes: the count stays at 1, and the next top-level call is taken as re-entrant, is not reset,
\* and reads the previous call's exception where Julia's stack is empty. TLC's counterexample:
\* HostCall, Enter, Rethrow (Julia's ErrorException lands), ImportCall, ImportThrow("exhaust"),
\* HostCall, Read (WT reads the ErrorException, Julia `nothing`).
\* Against the design (every flag as in MCExceptionStack.cfg, an import that throws); one flag flips.
SPECIFICATION Spec
CONSTANTS
    Vals = {"a", "b"}
    MaxFrames = 3
    MaxSteps = 15
    MaxCalls = 2
    Impl = "cells"
    RethrowChecksDepth = TRUE
    PushAtLanding = FALSE
    KeepsEntry = FALSE
    ResetAtEntry = FALSE
    Landing = "identity"
    TopLevelReset = TRUE
    LandingRestoresCount = TRUE
    EntryRestoresCount = TRUE
    EntryCatchesAll = TRUE
    ImportSiteCatch = FALSE
    HasImport = TRUE
    ImportThrows = TRUE
    HostCatchesTrap = FALSE
    PropagatesTrap = FALSE
    ImportExhausts = TRUE
    ExhaustReentrant = FALSE
INVARIANT TypeOK
INVARIANT Agrees
