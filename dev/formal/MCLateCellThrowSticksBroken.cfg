\* expect: RejectsOnlyMisuse
\* Broken variant: an init that throws leaves the field in state 1, so the next read, which dart would
\* run init for again, rejects as a cycle that never happened. TLC must report RejectsOnlyMisuse
\* violated.
SPECIFICATION Spec
CONSTANTS
    MaxOps = 3
    DefaultRead = FALSE
    NoMemo = FALSE
    CycleReruns = FALSE
    ThrowSticks = TRUE
    Overwrite = FALSE
INVARIANTS
    TypeOK
    Stable
    InitAtMostOnce
    OneInitAtATime
    NoDefaultRead
    ReadsAgree
    RejectsOnlyMisuse
PROPERTY Ends
CHECK_DEADLOCK TRUE
