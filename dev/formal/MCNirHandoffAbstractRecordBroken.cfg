\* expect: CcallablesJudged
\* Broken variant: a record infers a specialization other than the one the entry reached, as it would
\* were a ccallable's declared argument types allowed abstract (Julia refuses them, c.jl's
\* _ccallable): that specialization reaches a ccallable the one round never queued. TLC must report
\* CcallablesJudged violated.
SPECIFICATION Spec
CONSTANTS
    AbstractRecord = TRUE
    QueueAll = FALSE
    NoDedup = FALSE
    UnreadRepeat = FALSE
    SkipOdd = FALSE
    RecordAsBody = FALSE
    KeepIntrinsic = FALSE
INVARIANTS
    TypeOK
    CcallablesJudged
    QueuedReached
    OneBodyPerCI
    Complete
    RepeatAsserted
    Aligned
    RejectsOnlyGaps
PROPERTY Terminates
CHECK_DEADLOCK TRUE
