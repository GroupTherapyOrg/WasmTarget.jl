\* expect: NoPartialIntern
\* Broken instance: SkipChildEagerCheck = TRUE -- the recursive "AND every
\* field's own _const_init!" (types.jl) is skipped, so an
\* occurrence's eagerness is decided from its OWN kind/fstat only. Within
\* the exhaustive N=2 sweep, TLC finds a parent occurrence (kind="Imm",
\* fstat="Def") whose child is really non-eager (kind="Mut", or an undefined
\* field with the sentinel) -- under the bug the parent is wrongly
\* eager-eligible and gets a table-shared global despite the real Eager()
\* being FALSE, violating NoPartialIntern, claim (2), the claim this flag
\* isolates. N=2, not MCConstants' N=3: at N=3 the wrongly interned parent
\* can also share its global with an egal occurrence, a MutableNeverAliases
\* violation TLC reports first (it is listed first). At N=2 the only
\* occurrence with a child is the parent and its child is non-eager, so no
\* other occurrence holds a table global: every claim but NoPartialIntern
\* holds, and the instance violates exactly its own claim.
CONSTANTS
    N = 2
    EqIds <- MCEqIds
    Types <- MCTypes
    KeyByIsequal = FALSE
    InternMutableKind = FALSE
    SkipChildEagerCheck = TRUE
    FabricateUndefFields = FALSE
    HashOrderNumbering = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Canonicalization
    SharedOnlyIfEgal
    MutableNeverAliases
    NoPartialIntern
    NoFabrication
    DeterministicNumbering

PROPERTIES
    RejectHalts

CHECK_DEADLOCK TRUE
