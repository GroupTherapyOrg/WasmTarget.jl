\* Broken instance: SkipChildEagerCheck = TRUE -- the recursive "AND every
\* field's own _const_init_bytes!" (types.jl:316) is skipped, so an
\* occurrence's eagerness is decided from its OWN kind/fstat only. Within
\* the exhaustive N=3 sweep, TLC finds a parent occurrence (kind="Imm",
\* fstat="Def") whose child is really non-eager (e.g. kind="Mut", or itself
\* has a non-eager descendant) -- under the bug the parent is wrongly
\* eager-eligible and gets a table-shared global despite the real Eager()
\* being FALSE, violating NoPartialIntern (and generally MutableNeverAliases
\* too, whenever another real-non-eager occurrence shares its class).
CONSTANTS
    N = 3
    EqIds <- MCEqIds
    InternMutableKind = FALSE
    SkipChildEagerCheck = TRUE
    FabricateUndefFields = FALSE
    HashOrderNumbering = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Canonicalization
    MutableNeverAliases
    NoPartialIntern
    NoFabrication
    DeterministicNumbering

PROPERTIES
    RejectHalts

CHECK_DEADLOCK TRUE
