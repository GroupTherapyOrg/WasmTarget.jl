\* expect: Agrees
\* dev/MARCH.md 13.17 A15E1 (open finding, the design): the host calls an export from inside its
\* catch block. Julia's JL_CATCH restores the stack only after the block, so the escaped entry is
\* the top there and `rethrow()` in the call rethrows it; WT's entry cannot see the block and
\* starts as after the restore (top-level: null), so it raises Julia's ErrorException. WT's host
\* contract (host_glue_js, host_runtime_js) makes such a call one after the restore, which the
\* positive instances check.
\* Against the design (every flag as in MCExceptionStack.cfg); one flag flips.
SPECIFICATION Spec
CONSTANTS
    Vals = {"a", "b"}
    MaxFrames = 3
    MaxSteps = 15
    MaxCalls = 2
    Impl = "cells"
    RethrowChecksDepth = TRUE
    PushAtLanding = FALSE
    KeepsEntry = FALSE
    ResetAtEntry = FALSE
    Landing = "identity"
    TopLevelReset = TRUE
    GlueFinally = TRUE
    ReturnRestores = TRUE
    EntryTakesSlot = TRUE
    HasImport = TRUE
    ImportThrows = TRUE
    HostCatchesTrap = TRUE
    PropagatesTrap = TRUE
    ImportExhausts = TRUE
    ExhaustReentrant = TRUE
    ReraiseShared = FALSE
    HostCallsGlued = FALSE
    HostCallInCatch = TRUE
INVARIANT TypeOK
INVARIANT Agrees
