\* expect: Agrees
\* dev/MARCH.md 13.17 H11 (open finding, the design): a host re-raises a re-entrant escape whose
\* cell existed when the callee was entered, an entry of the caller's stack (the callee rethrew it).
\* Julia's host throw pushes a second entry; WT's landing takes the shared cell, so a later
\* rethrow(e) overwrites both. The positive instances re-raise every other escape.
\* Against the design (every flag as in MCExceptionStack.cfg); one flag flips.
SPECIFICATION Spec
CONSTANTS
    Vals = {"a", "b"}
    MaxFrames = 3
    MaxSteps = 15
    MaxCalls = 2
    Impl = "cells"
    RethrowChecksDepth = TRUE
    PushAtLanding = FALSE
    KeepsEntry = FALSE
    ResetAtEntry = FALSE
    Landing = "identity"
    TopLevelReset = TRUE
    GlueFinally = TRUE
    ReturnRestores = TRUE
    EntryTakesSlot = TRUE
    HasImport = TRUE
    ImportThrows = TRUE
    HostCatchesTrap = TRUE
    PropagatesTrap = TRUE
    ImportExhausts = TRUE
    ExhaustReentrant = TRUE
    ReraiseShared = TRUE
    HostCallsGlued = FALSE
INVARIANT TypeOK
INVARIANT Agrees
