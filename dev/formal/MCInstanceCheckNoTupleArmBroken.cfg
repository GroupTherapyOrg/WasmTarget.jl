\* expect: CheckIsJuliaIsa
\* Broken variant: a Tuple type is checked by the class table, as an interface type is. Julia's
\* Tuple is covariant, Tuple{Int,Int} <: Tuple{Real,Real}, though Tuple{Int,Int}'s supertype is Any,
\* so the table answers false where Julia answers true. TLC must report CheckIsJuliaIsa violated.
SPECIFICATION Spec
CONSTANTS
    NoTupleArm = TRUE
    NoTypeArm = FALSE
    OwnChainsOnly = FALSE
INVARIANTS
    TypeOK
    CheckIsJuliaIsa
CHECK_DEADLOCK FALSE
