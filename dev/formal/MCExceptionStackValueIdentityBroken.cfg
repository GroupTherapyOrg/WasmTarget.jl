\* expect: Agrees
\* A12P2: the landing finds its entry by ref.eq on the exception, else pushes one. Only a re-raise
\* by the host lands with a top that is not the payload's cell, so the shortest counterexample is 16
\* steps: the caller lands `a`, the callee throws `a` again, the host catches it, calls an export and
\* re-raises it; the landing keeps the caller's cell, and a rethrow(e) overwrites both entries.
\* MaxSteps = 16 here.
\* Against the design (every flag as in MCExceptionStack.cfg); one flag flips.
SPECIFICATION Spec
CONSTANTS
    Vals = {"a", "b"}
    MaxFrames = 3
    MaxSteps = 16
    MaxCalls = 2
    Impl = "cells"
    RethrowChecksDepth = TRUE
    PushAtLanding = FALSE
    KeepsEntry = FALSE
    ResetAtEntry = FALSE
    Landing = "value"
    TopLevelReset = TRUE
    GlueFinally = TRUE
    ReturnRestores = TRUE
    EntryTakesSlot = TRUE
    HasImport = TRUE
    ImportThrows = TRUE
    HostCatchesTrap = TRUE
    PropagatesTrap = TRUE
    ImportExhausts = TRUE
    ExhaustReentrant = TRUE
    ReraiseShared = FALSE
INVARIANT TypeOK
INVARIANT Agrees
