\* expect: RangeIsa
\* Broken variant: a class's range ends at the concrete counter itself, not one before it, so it holds
\* a class that is not its subtype. TLC must report RangeIsa violated.
SPECIFICATION Spec
CONSTANTS
    SharedCounter = FALSE
    OffByOne = TRUE
    NoImplementors = FALSE
    NoAdjacentMerge = FALSE
INVARIANTS
    TypeOK
    ConcreteDense
    AbstractAfter
    RangeIsa
    Normalized
CHECK_DEADLOCK TRUE
