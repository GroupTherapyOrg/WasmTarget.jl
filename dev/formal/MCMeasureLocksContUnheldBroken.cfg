\* expect: NoCheckBesideRunning
\* Broken variant: a pause that ends without the lock (F7's limit past a landing's wall, or an exception while it
\* polls) continues its stopped processes before it reaps them (4858155b, the t5b review's must-fix): the compile runs
\* beside the lander's check until the reap.
SPECIFICATION Spec
CONSTANTS
    Rounds = 2
    Kinds = {"LAND", "REB", "LAYER"}
    Slots = {"M1", "M2"}
    MaxDeaths = 1
    MaxReuse = 0
    RealTiming = TRUE
    FixYield = TRUE
    FixNonStops = TRUE
    Recheck = TRUE
    VerifyStop = TRUE
    StartIdentity = TRUE
    LayerStops = TRUE
    ReapUnheld = FALSE
INVARIANTS
    TypeOK
    NoCheckBesideRunning
    OneRoleHolder
CHECK_DEADLOCK TRUE
