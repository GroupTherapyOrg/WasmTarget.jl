\* The site check of a write (MCFieldSelectorTableSetCheck.tla's header): each setter selector's row holds only the
\* classes holding a field the write may take, and a class whose write jl_f_setfield refuses raises Julia's error at
\* the site, the first of its checks in its order: immutable, then the field (BoundsError for the position-written b,
\* FieldError for a), then a const or atomic field.
SPECIFICATION SetSpec
CONSTANTS
    N = 3
    Names = {"a", "b"}
    NoOverlapCheck = FALSE
    NoFieldError = TRUE
    ByPosition = {"b"}
    NoSiteCheck = FALSE
    NoSetCheck = FALSE
    FieldFirst = FALSE
INVARIANTS
    TypeOK
    SiteTypeOK
    SetTypeOK
    SlotUnique
    DispatchExact
    SetCheckTraps
    SetWritesExact
\* Ends (termination) is MCFieldSelectorTable.cfg's claim: Pack and Finish are its, held and frozen constant
CHECK_DEADLOCK TRUE
