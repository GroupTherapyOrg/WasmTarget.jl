\* expect: SlotUnique
\* Broken variant: a row fits when its first value's slot is free, so a later row is placed over a
\* slot an earlier row holds. TLC must report SlotUnique violated.
SPECIFICATION Spec
CONSTANTS
    N = 3
    Names = {"a", "b"}
    NoOverlapCheck = TRUE
    NoFieldError = FALSE
INVARIANTS
    TypeOK
    SlotUnique
    DispatchExact
    MissingFieldTraps
PROPERTY Ends
CHECK_DEADLOCK TRUE
