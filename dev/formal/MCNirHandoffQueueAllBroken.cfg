\* expect: QueuedReached
\* Broken variant: every ccallable of the image queued, as juliac queues them for a library
\* (--compile-ccallable): a ccallable the entry never reaches is judged and compiled. TLC must report
\* QueuedReached violated.
SPECIFICATION Spec
CONSTANTS
    AbstractRecord = FALSE
    QueueAll = TRUE
    NoDedup = FALSE
    UnreadRepeat = FALSE
    SkipOdd = FALSE
    RecordAsBody = FALSE
    KeepIntrinsic = FALSE
INVARIANTS
    TypeOK
    CcallablesJudged
    QueuedReached
    OneBodyPerCI
    Complete
    RepeatAsserted
    Aligned
    RejectsOnlyGaps
PROPERTY Terminates
CHECK_DEADLOCK TRUE
